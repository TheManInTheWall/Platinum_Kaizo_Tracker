  function activeActors(node) {
    var out = [];
    ['A', 'B'].forEach(function (side) {
      node.active[side].forEach(function (idx) {
        var m = node.mons[side][idx];
        if (!m.fainted) out.push({ side: side, idx: idx });
      });
    });
    return out;
  }

  function renderTurnPanel(node, container) {
    container.innerHTML = '';
    var actors = activeActors(node);
    if (!actors.length) { container.appendChild(el('div', { class: 'battle-waiting', text: 'No active Pok\u00e9mon to act.' })); return; }

    container.appendChild(el('div', { class: 'battle-choice-label', text: 'Every active Pok\u00e9mon on the field needs an action this turn' }));

    var grid = el('div', { class: 'fc-turn-grid' });
    var sideWraps = { A: el('div', { class: 'fc-side-turn-col' }), B: el('div', { class: 'fc-side-turn-col' }) };
    renderSideMonInfo(node, 'A', sideWraps.A);
    renderSideMonInfo(node, 'B', sideWraps.B);
    grid.appendChild(sideWraps.A);
    grid.appendChild(sideWraps.B);
    var getters = [];

    actors.forEach(function (actor) {
      var mon = node.mons[actor.side][actor.idx];
      var tpl = teamsData[actor.side][mon.tplIndex];
      var col = el('div', { class: 'fc-turn-col' });
      col.appendChild(el('div', { class: 'side-label ' + (actor.side === 'A' ? 'attacker' : 'defender'), text: tpl.species + '\u2019s action' }));

      var typeSel = el('select', {});
      [['move', 'Use a move'], ['item', 'Use an item'], ['switch', 'Switch out'], ['none', 'Do nothing']].forEach(function (p) {
        typeSel.appendChild(el('option', { value: p[0], text: p[1] }));
      });
      col.appendChild(typeSel);
      var sub = el('div', { class: 'fc-turn-sub' });
      col.appendChild(sub);

      var getSubValue = function () { return null; };

      function buildMoveSub() {
        sub.innerHTML = '';
        var moveSel = el('select', {});
        tpl.moves.forEach(function (mv) { if (mv) moveSel.appendChild(el('option', { value: mv, text: mv })); });
        sub.appendChild(el('div', { class: 'field' }, [el('label', { text: 'Move' }), moveSel]));

        var oSide = otherSide(actor.side);
        var targetOpts = node.active[oSide].filter(function (i) { return !node.mons[oSide][i].fainted; });
        var targetSel = null;
        if (targetOpts.length > 1) {
          targetSel = el('select', {});
          targetOpts.forEach(function (i) { targetSel.appendChild(el('option', { value: String(i), text: teamsData[oSide][node.mons[oSide][i].tplIndex].species })); });
          sub.appendChild(el('div', { class: 'field' }, [el('label', { text: 'Target' }), targetSel]));
        }

        var infoBox = el('div', { class: 'fc-move-info' });
        sub.appendChild(infoBox);

        var hitsInput = null;
        var hitsWrap = el('div', { class: 'field' });
        sub.appendChild(hitsWrap);

        function refreshInfo() {
          var moveName = moveSel.value;
          if (!moveName) return;
          var mv = moveData(moveName);
          var tIdx = targetSel ? parseInt(targetSel.value, 10) : targetOpts[0];
          hitsWrap.innerHTML = '';
          hitsInput = null;
          if (tIdx === undefined) { infoBox.textContent = 'No valid target (opponent side empty).'; return; }
          var defMon = node.mons[oSide][tIdx];
          var acc = computeAccuracy(moveName, { side: actor.side, tplIndex: mon.tplIndex, boosts: mon.boosts }, { side: oSide, tplIndex: defMon.tplIndex, boosts: defMon.boosts }, node.field);
          var maxHits = mv && mv.multihit ? (Array.isArray(mv.multihit) ? mv.multihit[1] : mv.multihit) : 1;
          if (maxHits > 1) {
            hitsWrap.appendChild(el('label', { text: 'Hits (if it connects)' }));
            hitsInput = el('input', { type: 'number', min: '1', max: String(maxHits), value: String(maxHits) });
            hitsWrap.appendChild(hitsInput);
          }
          var accText = acc.cantMiss ? 'Can\u2019t miss' : (acc.unknown ? 'accuracy unknown' : acc.base + '% \u2192 ' + acc.effective + '%');
          infoBox.innerHTML = '';
          infoBox.appendChild(el('div', { text: (mv.category || 'Status') + ' \u00b7 ' + (mv.basePower || '\u2014') + ' BP \u00b7 ' + accText }));
        }
        moveSel.addEventListener('change', refreshInfo);
        if (targetSel) targetSel.addEventListener('change', refreshInfo);

        var hitToggleWrap = el('div', { class: 'crit-toggle' });
        var hitRadio = el('input', { type: 'radio', name: 'fc-turn-hitmiss-' + actor.side + actor.idx, checked: true });
        var missRadio = el('input', { type: 'radio', name: 'fc-turn-hitmiss-' + actor.side + actor.idx });
        hitToggleWrap.appendChild(hitRadio); hitToggleWrap.appendChild(document.createTextNode('Hits'));
        hitToggleWrap.appendChild(missRadio); hitToggleWrap.appendChild(document.createTextNode('Misses'));
        sub.appendChild(hitToggleWrap);

        var dmgSel = el('select', {});
        ['max', 'avg', 'min'].forEach(function (v) { dmgSel.appendChild(el('option', { value: v, text: v.charAt(0).toUpperCase() + v.slice(1) + ' roll' })); });
        sub.appendChild(el('div', { class: 'field' }, [el('label', { text: 'Damage roll (if hit)' }), dmgSel]));

        var critChk = el('input', { type: 'checkbox' });
        sub.appendChild(el('label', { class: 'crit-toggle' }, [critChk, document.createTextNode('Assume critical hit')]));

        refreshInfo();

        getSubValue = function () {
          var tIdx = targetSel ? parseInt(targetSel.value, 10) : targetOpts[0];
          return {
            type: 'move', moveName: moveSel.value, targetIdx: tIdx, targetSide: oSide,
            hit: hitRadio.checked, hits: hitsInput ? (parseInt(hitsInput.value, 10) || 1) : 1, dmgChoice: dmgSel.value,
            crit: critChk.checked
          };
        };
      }

      function buildItemSub() {
        sub.innerHTML = '';
        var itemSel = el('select', {});
        TRAINER_ITEMS.forEach(function (it) { itemSel.appendChild(el('option', { value: it.name, text: it.name })); });
        sub.appendChild(el('div', { class: 'field' }, [el('label', { text: 'Item' }), itemSel]));
        sub.appendChild(el('div', { class: 'fc-move-info', text: 'Used on this Pok\u00e9mon (' + tpl.species + ') itself.' }));
        getSubValue = function () { return { type: 'item', itemName: itemSel.value }; };
      }

      function buildSwitchSub() {
        sub.innerHTML = '';
        var bench = node.mons[actor.side].map(function (m2, i2) { return { m: m2, i: i2 }; })
          .filter(function (x) { return node.active[actor.side].indexOf(x.i) === -1 && !x.m.fainted; });
        if (!bench.length) { sub.appendChild(el('div', { class: 'fc-move-info', text: 'No bench Pok\u00e9mon available.' })); getSubValue = function () { return null; }; return; }
        var benchSel = el('select', {});
        bench.forEach(function (x) { benchSel.appendChild(el('option', { value: String(x.i), text: teamsData[actor.side][x.m.tplIndex].species })); });
        sub.appendChild(el('div', { class: 'field' }, [el('label', { text: 'Switch in' }), benchSel]));
        getSubValue = function () { return { type: 'switch', benchIdx: parseInt(benchSel.value, 10) }; };
      }

      function refreshSub() {
        var t = typeSel.value;
        if (t === 'move') buildMoveSub();
        else if (t === 'item') buildItemSub();
        else if (t === 'switch') buildSwitchSub();
        else { sub.innerHTML = ''; getSubValue = function () { return null; }; }
      }
      typeSel.addEventListener('change', refreshSub);
      refreshSub();

      sideWraps[actor.side].appendChild(col);
      getters.push({ side: actor.side, idx: actor.idx, getType: function () { return typeSel.value; }, getValue: function () { return getSubValue(); } });
    });

    container.appendChild(grid);

    var orderWrap = el('div', { class: 'crit-toggle' });
    var aFirstRadio = el('input', { type: 'radio', name: 'fc-turn-order', checked: true });
    var bFirstRadio = el('input', { type: 'radio', name: 'fc-turn-order' });
    orderWrap.appendChild(aFirstRadio); orderWrap.appendChild(document.createTextNode('Team A acts first'));
    orderWrap.appendChild(bFirstRadio); orderWrap.appendChild(document.createTextNode('Team B acts first'));
    container.appendChild(el('div', { class: 'battle-choice-label', text: 'Speed order (who resolves first matters if it can KO before the other acts)' }));
    container.appendChild(orderWrap);

    var commitBtn = el('button', { class: 'swap-btn', text: 'Commit this turn as a branch' });

    function computeTurnOutcome(order, forcedMissKey) {
      var s = cloneNodeState(node);
      var labels = [];
      var faintedThisTurn = {};

      order.forEach(function (sideKey) {
        getters.filter(function (g) { return g.side === sideKey; }).forEach(function (g) {
          var monState = s.mons[g.side][g.idx];
          var monKey = g.side + g.idx;
          if (monState.fainted || faintedThisTurn[monKey]) { return; }
          var val = g.getValue();
          var tpl = teamsData[g.side][monState.tplIndex];
          if (!val || g.getType() === 'none') { labels.push(tpl.species + ': did nothing'); return; }

          if (val.type === 'move') {
            if (!val.moveName) { labels.push(tpl.species + ': (no move selected)'); return; }
            var forcedMiss = forcedMissKey === monKey;
            if (!val.hit || forcedMiss) { labels.push(tpl.species + ' ' + val.moveName + ' \u2014 miss' + (forcedMiss ? ' (auto scenario)' : '')); return; }
            var targetState = s.mons[val.targetSide][val.targetIdx];
            if (targetState.fainted) { labels.push(tpl.species + ' ' + val.moveName + ' \u2014 target already down'); return; }
            var atkP = pokemonFromMonState(monState);
            var defP = pokemonFromMonState(targetState);
            var moveOpts = {};
            if (val.hits > 1) moveOpts.hits = val.hits;
            if (val.crit) moveOpts.isCrit = true;
            var move = new C.Move(gen, val.moveName, moveOpts);
            var field = buildCalcField(s, g.side);
            var range;
            try { range = C.calculate(gen, atkP, defP, move, field).range(); } catch (e) { range = [0, 0]; }
            var dmg = val.dmgChoice === 'max' ? range[1] : (val.dmgChoice === 'min' ? range[0] : Math.round((range[0] + range[1]) / 2));
            targetState.curHP = clamp(targetState.curHP - dmg, 0, targetState.maxHP);
            if (targetState.curHP === 0) { targetState.fainted = true; faintedThisTurn[val.targetSide + val.targetIdx] = true; }
            labels.push(tpl.species + ' ' + val.moveName + (val.hits > 1 ? ' (' + val.hits + ' hits)' : '') + (val.crit ? ' [crit]' : '') + ' \u2192 ' + dmg + ' dmg' + (targetState.fainted ? ' (fainted)' : ''));
          } else if (val.type === 'item') {
            var itemDef = TRAINER_ITEMS.filter(function (it) { return it.name === val.itemName; })[0];
            if (!itemDef) return;
            if (itemDef.revive) {
              if (!monState.fainted) { labels.push(tpl.species + ': ' + val.itemName + ' had no target (not fainted)'); return; }
              monState.fainted = false;
              monState.curHP = itemDef.revive === 'full' ? monState.maxHP : Math.round(monState.maxHP / 2);
              delete faintedThisTurn[monKey];
              labels.push(tpl.species + ' revived with ' + val.itemName + ' (' + monState.curHP + ' HP)');
              return;
            }
            var parts = [];
            if (itemDef.heal) {
              var healAmt = itemDef.heal === 'full' ? (monState.maxHP - monState.curHP) : itemDef.heal;
              monState.curHP = clamp(monState.curHP + healAmt, 0, monState.maxHP);
              parts.push('+' + healAmt + ' HP');
            }
            if (itemDef.cureStatus && monState.status) { parts.push('cured ' + monState.status); monState.status = ''; }
            if (itemDef.boost) {
              Object.keys(itemDef.boost).forEach(function (st) { monState.boosts[st] = clamp((monState.boosts[st] || 0) + itemDef.boost[st], -6, 6); parts.push((STAT_LABEL[st] || st) + ' +' + itemDef.boost[st]); });
            }
            labels.push(tpl.species + ' used ' + val.itemName + (parts.length ? ' (' + parts.join(', ') + ')' : ''));
          } else if (val.type === 'switch') {
            var outSpecies = tpl.species;
            var inSpecies = teamsData[g.side][s.mons[g.side][val.benchIdx].tplIndex].species;
            var slotPos = s.active[g.side].indexOf(g.idx);
            if (slotPos !== -1) s.active[g.side][slotPos] = val.benchIdx;
            labels.push(outSpecies + ' \u2192 switch \u2192 ' + inSpecies);
          }
        });
      });

      return { state: s, label: labels.join(' | ') };
    }

    commitBtn.addEventListener('click', function () {
      var order = aFirstRadio.checked ? ['A', 'B'] : ['B', 'A'];

      var main = computeTurnOutcome(order, null);
      currentId = addChild(node.id, main.label, main.state);

      // automation: for every fallible move declared as a hit, also branch off a sibling where that one move misses instead
      getters.forEach(function (g) {
        var val = g.getValue();
        if (!val || val.type !== 'move' || !val.hit || !val.moveName) return;
        var monState = node.mons[g.side][g.idx];
        var targetState = node.mons[val.targetSide][val.targetIdx];
        var acc = computeAccuracy(val.moveName, { side: g.side, tplIndex: monState.tplIndex, boosts: monState.boosts }, { side: val.targetSide, tplIndex: targetState.tplIndex, boosts: targetState.boosts }, node.field);
        if (acc.cantMiss || acc.unknown || acc.effective == null || acc.effective >= 100) return;
        var missOutcome = computeTurnOutcome(order, g.side + g.idx);
        addChild(node.id, missOutcome.label + ' [auto: ' + acc.effective + '% to hit]', missOutcome.state);
      });

      renderAll();
    });
    container.appendChild(commitBtn);
  }


  // ---------- action panel: manual edit ----------
  function renderFieldEditPanel(node, container) {
    container.innerHTML = '';
    var f = node.field;
    var wrap = el('div', { class: 'fc-turn-grid' });

    var globalCol = el('div', { class: 'fc-side-turn-col' });
    globalCol.appendChild(el('div', { class: 'side-label', text: 'Global' }));
    var weatherSel = el('select', {});
    ['None', 'Sun', 'Harsh Sunshine', 'Rain', 'Heavy Rain', 'Sand', 'Snow', 'Strong Winds'].forEach(function (w) {
      var o = el('option', { value: w, text: w }); if (w === f.weather) o.selected = true; weatherSel.appendChild(o);
    });
    globalCol.appendChild(el('div', { class: 'field' }, [el('label', { text: 'Weather' }), weatherSel]));
    var terrainSel = el('select', {});
    ['None', 'Electric', 'Grassy', 'Psychic', 'Misty'].forEach(function (t) {
      var o = el('option', { value: t, text: t }); if (t === f.terrain) o.selected = true; terrainSel.appendChild(o);
    });
    globalCol.appendChild(el('div', { class: 'field' }, [el('label', { text: 'Terrain' }), terrainSel]));
    var gravChk = el('input', { type: 'checkbox' }); gravChk.checked = f.gravity;
    globalCol.appendChild(el('label', { class: 'crit-toggle' }, [gravChk, document.createTextNode('Gravity')]));
    wrap.appendChild(globalCol);

    var sideEls = {};
    ['A', 'B'].forEach(function (side) {
      var sKey = side === 'A' ? 'sideA' : 'sideB';
      var sData = f[sKey];
      var col = el('div', { class: 'fc-side-turn-col' });
      col.appendChild(el('div', { class: 'side-label ' + (side === 'A' ? 'attacker' : 'defender'), text: 'Team ' + side + ' side' }));

      var els = {};
      function chk(label, key) {
        var input = el('input', { type: 'checkbox' }); input.checked = sData[key];
        els[key] = input;
        col.appendChild(el('label', { class: 'crit-toggle' }, [input, document.createTextNode(label)]));
      }
      chk('Reflect', 'reflect'); chk('Light Screen', 'lightScreen'); chk('Aurora Veil', 'auroraVeil'); chk('Stealth Rock', 'stealthRock');
      var spikesSel = el('select', {});
      [0, 1, 2, 3].forEach(function (n) { var o = el('option', { value: String(n), text: n === 0 ? 'No Spikes' : n + ' layer' + (n > 1 ? 's' : '') }); if (sData.spikes === n) o.selected = true; spikesSel.appendChild(o); });
      col.appendChild(el('div', { class: 'field' }, [el('label', { text: 'Spikes' }), spikesSel]));
      els.spikes = spikesSel;

      if (format === 'doubles') {
        col.appendChild(el('div', { class: 'battle-choice-label', text: 'Ally support (this side\u2019s attacker)' }));
        chk('Helping Hand', 'helpingHand'); chk('Battery', 'battery'); chk('Power Spot', 'powerSpot'); chk('Steely Spirit', 'steelySpirit'); chk('Flower Gift', 'flowerGift');
        col.appendChild(el('div', { class: 'battle-choice-label', text: 'Ally support (this side\u2019s defender)' }));
        chk('Friend Guard', 'friendGuard');
      }
      sideEls[side] = els;
      wrap.appendChild(col);
    });

    container.appendChild(wrap);
    var applyBtn = el('button', { class: 'swap-btn', text: 'Apply as new branch' });
    applyBtn.addEventListener('click', function () {
      var s = cloneNodeState(node);
      s.field.weather = weatherSel.value;
      s.field.terrain = terrainSel.value;
      s.field.gravity = gravChk.checked;
      ['A', 'B'].forEach(function (side) {
        var sKey = side === 'A' ? 'sideA' : 'sideB';
        var els = sideEls[side];
        Object.keys(els).forEach(function (key) {
          s.field[sKey][key] = key === 'spikes' ? parseInt(els[key].value, 10) : els[key].checked;
        });
      });
      currentId = addChild(node.id, 'Field conditions updated', s);
      renderAll();
    });
    container.appendChild(applyBtn);
  }

  function renderManualEditPanel(node, container) {
    container.innerHTML = '';
    var opts = [];
    ['A', 'B'].forEach(function (side) {
      node.mons[side].forEach(function (m, i) {
        opts.push({ side: side, idx: i, label: 'Team ' + side + ': ' + teamsData[side][m.tplIndex].species + (m.fainted ? ' (fainted)' : '') });
      });
    });
    var sel = el('select', {});
    opts.forEach(function (o, i) { sel.appendChild(el('option', { value: String(i), text: o.label })); });
    container.appendChild(el('div', { class: 'field' }, [el('label', { text: 'Pok\u00e9mon' }), sel]));

    var hpInput = el('input', { type: 'number', min: '0' });
    var statusSel = el('select', {});
    STATUS_OPTS.forEach(function (o) { statusSel.appendChild(el('option', { value: o.id, text: o.label })); });
    var faintedChk = el('input', { type: 'checkbox' });
    var boostInputs = {};
    var boostRow = el('div', { class: 'fc-boost-row' });
    ['atk', 'def', 'spa', 'spd', 'spe', 'accuracy', 'evasion'].forEach(function (st) {
      var wrap = el('div', { class: 'acc-eva-row' });
      wrap.appendChild(el('span', { class: 'acc-eva-label', text: STAT_LABEL[st] || st }));
      var inp = el('input', { type: 'number', min: '-6', max: '6', style: 'width:44px' });
      boostInputs[st] = inp;
      wrap.appendChild(inp);
      boostRow.appendChild(wrap);
    });

    var switchBox = el('div', { class: 'fc-outcome-box' });

    function loadFromSelection() {
      var o = opts[parseInt(sel.value, 10)];
      var m = node.mons[o.side][o.idx];
      hpInput.value = m.curHP;
      hpInput.max = m.maxHP;
      statusSel.value = m.status;
      faintedChk.checked = m.fainted;
      ['atk', 'def', 'spa', 'spd', 'spe', 'accuracy', 'evasion'].forEach(function (st) { if (boostInputs[st]) boostInputs[st].value = m.boosts[st] || 0; });

      switchBox.innerHTML = '';
      var isActive = node.active[o.side].indexOf(o.idx) !== -1;
      if (!isActive && !m.fainted) {
        switchBox.appendChild(el('div', { class: 'battle-choice-label', text: 'Not currently active' }));
        var slotSel = null;
        if (node.active[o.side].length > 1) {
          slotSel = el('select', {});
          node.active[o.side].forEach(function (activeIdx, slotN) {
            slotSel.appendChild(el('option', { value: String(slotN), text: 'Replace slot ' + (slotN + 1) + ' (' + teamsData[o.side][node.mons[o.side][activeIdx].tplIndex].species + ')' }));
          });
          switchBox.appendChild(slotSel);
        }
        var switchBtn = el('button', { class: 'swap-btn', text: 'Switch this in' });
        switchBtn.addEventListener('click', function () {
          var slotN = slotSel ? parseInt(slotSel.value, 10) : 0;
          var s = cloneNodeState(node);
          var outgoing = teamsData[o.side][s.mons[o.side][s.active[o.side][slotN]].tplIndex].species;
          var incoming = teamsData[o.side][o.idx].species;
          s.active[o.side][slotN] = o.idx;
          currentId = addChild(node.id, 'Team ' + o.side + ': ' + outgoing + ' \u2192 switch \u2192 ' + incoming, s);
          renderAll();
        });
        switchBox.appendChild(switchBtn);
      }
    }
    sel.addEventListener('change', loadFromSelection);

    container.appendChild(el('div', { class: 'field' }, [el('label', { text: 'Current HP' }), hpInput]));
    container.appendChild(el('div', { class: 'field' }, [el('label', { text: 'Status' }), statusSel]));
    container.appendChild(el('label', { class: 'crit-toggle' }, [faintedChk, document.createTextNode('Fainted')]));
    container.appendChild(switchBox);
    container.appendChild(el('div', { class: 'battle-choice-label', text: 'Stat stages' }));
    container.appendChild(boostRow);

    var labelInput = el('input', { type: 'text', class: 'text-input', placeholder: 'Branch label (e.g. "used Swords Dance")' });
    container.appendChild(el('div', { class: 'field' }, [el('label', { text: 'Label' }), labelInput]));

    var applyBtn = el('button', { class: 'swap-btn', text: 'Create branch' });
    applyBtn.addEventListener('click', function () {
      var o = opts[parseInt(sel.value, 10)];
      var s = cloneNodeState(node);
      var m = s.mons[o.side][o.idx];
      m.curHP = clamp(parseInt(hpInput.value, 10) || 0, 0, m.maxHP);
      m.status = statusSel.value;
      m.fainted = faintedChk.checked || m.curHP === 0;
      ['atk', 'def', 'spa', 'spd', 'spe', 'accuracy', 'evasion'].forEach(function (st) {
        m.boosts[st] = clamp(parseInt(boostInputs[st].value, 10) || 0, -6, 6);
      });
      var label = labelInput.value.trim() || (teamsData[o.side][m.tplIndex].species + ': manual edit');
      currentId = addChild(node.id, label, s);
      renderAll();
    });
    container.appendChild(applyBtn);

    loadFromSelection();
  }

  // ---------- tree rendering ----------
  function renderTreeNode(id, container) {
    var node = nodes[id];
    var wrap = el('div', { class: 'fc-tree-node' });
    var btn = el('button', { class: 'fc-tree-btn' + (id === currentId ? ' current' : ''), text: node.label });
    btn.addEventListener('click', function () { currentId = id; renderAll(); });
    wrap.appendChild(btn);
    if (node.children.length) {
      var kids = el('div', { class: 'fc-tree-children' });
      node.children.forEach(function (cid) { renderTreeNode(cid, kids); });
      wrap.appendChild(kids);
    }
    container.appendChild(wrap);
  }

  // ---------- top-level render ----------
  function renderAll() {
    var node = nodes[currentId];
    var treeHolder = document.getElementById('fc-tree-holder');
    var actionHolder = document.getElementById('fc-action-holder');
    var fieldHolder = document.getElementById('fc-field-holder');

    treeHolder.innerHTML = '';
    renderTreeNode(rootId, treeHolder);

    fieldHolder.innerHTML = '';
    fieldHolder.appendChild(renderFieldStrip(node));

    actionHolder.innerHTML = '';
    var forced = sidesNeedingForcedSwitch(node);
    if (forced.length) {
      renderForcedSwitchPanel(node, forced, actionHolder);
      return;
    }

    var tabs = el('div', { class: 'tab-nav' });
    var moveTabBtn = el('button', { class: 'tab-btn active', text: 'Plan a turn' });
    var editTabBtn = el('button', { class: 'tab-btn', text: 'Manual edit' });
    var fieldTabBtn = el('button', { class: 'tab-btn', text: 'Field' });
    var panelHolder = el('div', { class: 'fc-panel-holder' });
    function setActive(btn) { [moveTabBtn, editTabBtn, fieldTabBtn].forEach(function (b) { b.classList.toggle('active', b === btn); }); }
    moveTabBtn.addEventListener('click', function () { setActive(moveTabBtn); renderTurnPanel(node, panelHolder); });
    editTabBtn.addEventListener('click', function () { setActive(editTabBtn); renderManualEditPanel(node, panelHolder); });
    fieldTabBtn.addEventListener('click', function () { setActive(fieldTabBtn); renderFieldEditPanel(node, panelHolder); });
    tabs.appendChild(moveTabBtn); tabs.appendChild(editTabBtn); tabs.appendChild(fieldTabBtn);
    actionHolder.appendChild(tabs);
    actionHolder.appendChild(panelHolder);
    renderTurnPanel(node, panelHolder);
  }

  // ---------- setup screen ----------
  var SAMPLE_A = 'Garchomp @ Choice Band\nAbility: Rough Skin\nLevel: 100\nEVs: 252 Atk / 4 SpD / 252 Spe\nJolly Nature\n- Earthquake\n- Outrage\n- Stone Edge\n- Swords Dance\n\nLandorus-Therian @ Leftovers\nAbility: Intimidate\nLevel: 100\nEVs: 252 HP / 252 Def / 4 SpD\nImpish Nature\n- Earthquake\n- Stealth Rock\n- U-turn\n- Toxic';
  var SAMPLE_B = 'Corviknight @ Leftovers\nAbility: Pressure\nLevel: 100\nEVs: 252 HP / 252 Def / 4 SpD\nImpish Nature\n- Body Press\n- Roost\n- U-turn\n- Defog\n\nMaushold @ Loaded Dice\nAbility: Technician\nLevel: 100\nEVs: 252 Atk / 4 SpD / 252 Spe\nJolly Nature\n- Population Bomb\n- Tidy Up\n- Encore\n- Follow Me';

  function renderSetupScreen() {
    rootEl.innerHTML = '';
    var box = el('div', { class: 'battle-import' });
    box.appendChild(el('div', { class: 'battle-import-label', text: 'Paste full teams. This mode never rolls dice for you \u2014 you declare what happens (hit/miss, hit count, damage roll) and branch as many scenarios as you want.' }));

    var formatRow = el('div', { class: 'crit-toggle' });
    var singlesRadio = el('input', { type: 'radio', name: 'fc-format', id: 'fc-fmt-singles', checked: true });
    var doublesRadio = el('input', { type: 'radio', name: 'fc-format', id: 'fc-fmt-doubles' });
    singlesRadio.addEventListener('change', function () { if (singlesRadio.checked) format = 'singles'; });
    doublesRadio.addEventListener('change', function () { if (doublesRadio.checked) format = 'doubles'; });
    formatRow.appendChild(singlesRadio); formatRow.appendChild(document.createTextNode('Singles'));
    formatRow.appendChild(doublesRadio); formatRow.appendChild(document.createTextNode('Doubles'));
    box.appendChild(formatRow);

    var row = el('div', { class: 'battle-import-row' });
    var colA = el('div', { class: 'battle-import-col' });
    colA.appendChild(el('label', { text: 'Team A' }));
    var taA = el('textarea', { rows: '14' });
    taA.value = SAMPLE_A;
    colA.appendChild(taA);
    row.appendChild(colA);
    var colB = el('div', { class: 'battle-import-col' });
    colB.appendChild(el('label', { text: 'Team B' }));
    var taB = el('textarea', { rows: '14' });
    taB.value = SAMPLE_B;
    colB.appendChild(taB);
    row.appendChild(colB);
    box.appendChild(row);

    var errEl = el('div', { class: 'battle-import-error' });
    box.appendChild(errEl);

    var startBtn = el('button', { class: 'swap-btn', text: 'Start planning' });
    startBtn.addEventListener('click', function () {
      var teamA = parseTeam(taA.value);
      var teamB = parseTeam(taB.value);
      if (!teamA.length) { errEl.textContent = 'Could not parse Team A.'; return; }
      if (!teamB.length) { errEl.textContent = 'Could not parse Team B.'; return; }
      var needed = format === 'doubles' ? 2 : 1;
      if (teamA.length < needed || teamB.length < needed) { errEl.textContent = 'Doubles needs at least 2 Pok\u00e9mon per team.'; return; }
      var badSpecies = teamA.concat(teamB).find(function (s) { return !speciesExists(s.species); });
      if (badSpecies) { errEl.textContent = '\u201c' + badSpecies.species + '\u201d isn\u2019t a valid species.'; return; }
      teamsData = { A: teamA, B: teamB };
      nodes = {}; nodeSeq = 0;
      makeRoot();
      renderPlannerScreen();
    });
    box.appendChild(startBtn);
    rootEl.appendChild(box);
  }

  function renderPlannerScreen() {
    rootEl.innerHTML = '';
    var headRow = el('div', { class: 'battle-choice-label' }, [document.createTextNode('Flowchart (click any node to jump there)')]);
    rootEl.appendChild(headRow);
    rootEl.appendChild(el('div', { class: 'fc-tree-scroll', id: 'fc-tree-holder' }));
    rootEl.appendChild(el('div', { id: 'fc-action-holder' }));
    rootEl.appendChild(el('div', { id: 'fc-field-holder' }));
    var btnRow = el('div', { class: 'fc-turn-grid' });
    var newBtn = el('button', { class: 'reset-btn', text: 'New plan' });
    newBtn.addEventListener('click', function () { renderSetupScreen(); });
    var shareBtn = el('button', { class: 'reset-btn', text: 'Share this plan' });
    var shareStatus = el('span', { class: 'share-status' });
    shareBtn.addEventListener('click', function () {
      var url = buildShareUrl();
      history.replaceState(null, '', url);
      var done = function () { shareStatus.textContent = 'Copied!'; setTimeout(function () { shareStatus.textContent = ''; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done, function () { window.prompt('Copy this link:', url); });
      } else { window.prompt('Copy this link:', url); }
    });
    btnRow.appendChild(newBtn); btnRow.appendChild(shareBtn); btnRow.appendChild(shareStatus);
    rootEl.appendChild(btnRow);
    renderAll();
  }

  // ---------- shareable state (URL hash, separate namespace from the Damage Calc tab's #s=) ----------
  function b64EncodeUnicode(str) { return btoa(unescape(encodeURIComponent(str))); }
  function b64DecodeUnicode(str) { return decodeURIComponent(escape(atob(str))); }

  function buildShareUrl() {
    var payload = { v: 1, format: format, teamsData: teamsData, nodes: nodes, rootId: rootId, currentId: currentId, nodeSeq: nodeSeq };
    var base = location.href.split('#')[0];
    return base + '#bp=' + b64EncodeUnicode(JSON.stringify(payload));
  }

  function loadStateFromHash() {
    var m = (location.hash || '').match(/#bp=(.+)$/);
    if (!m) return false;
    try {
      var payload = JSON.parse(b64DecodeUnicode(decodeURIComponent(m[1])));
      if (!payload || !payload.teamsData || !payload.nodes) return false;
      format = payload.format || 'singles';
      teamsData = payload.teamsData;
      nodes = payload.nodes;
      rootId = payload.rootId;
      currentId = payload.currentId;
      nodeSeq = payload.nodeSeq || 0;
      return true;
    } catch (e) { return false; }
  }

  function boot() {
    booted = true;
    rootEl = document.getElementById('battle-root');
    try { ACCURACY_TABLE = JSON.parse(document.getElementById('accuracy-data').textContent); } catch (e) { ACCURACY_TABLE = {}; }
    if (loadStateFromHash()) { renderPlannerScreen(); } else { renderSetupScreen(); }
  }

  return { boot: boot, get booted() { return booted; } };
})();

</script>
</body>
</html>
