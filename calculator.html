      var finalEl = el('div', { class: 'stat-final' });
      finalStatEls[st] = finalEl;
      statTable.appendChild(finalEl);

      if (st === 'hp') {
        statTable.appendChild(el('div', {}));
      } else {
        var stepper = el('div', { class: 'boost-stepper' });
        var minus = el('button', { text: '\u2212' });
        var valEl = el('span', { class: 'boost-val', text: String(s.boosts[st]) });
        var plus = el('button', { text: '+' });
        minus.addEventListener('click', function () { s.boosts[st] = clamp(s.boosts[st] - 1, -6, 6); renderStats(); renderBadges(); recalc(); });
        plus.addEventListener('click', function () { s.boosts[st] = clamp(s.boosts[st] + 1, -6, 6); renderStats(); renderBadges(); recalc(); });
        boostValEls[st] = valEl;
        stepper.appendChild(minus); stepper.appendChild(valEl); stepper.appendChild(plus);
        statTable.appendChild(stepper);
      }
    });

    var evTotalEl = el('div', { class: 'ev-total' });
    panel.appendChild(evTotalEl);

    function renderStats() {
      var total = 0;
      STAT_ORDER.forEach(function (st) {
        total += s.evs[st];
        var base = sp ? sp.baseStats[st] : 0;
        var val = C.calcStat(gen, st === 'spd' ? 'spd' : st, base, s.ivs[st], s.evs[st], s.level, s.nature);
        var cls = 'stat-final';
        var natureObj = null;
        for (var nn of gen.natures) { if (nn.name === s.nature) { natureObj = nn; break; } }
        if (natureObj && natureObj.plus === st) cls += ' buffed';
        if (natureObj && natureObj.minus === st) cls += ' hindered';
        finalStatEls[st].className = cls;
        finalStatEls[st].textContent = val;
        if (boostValEls[st]) {
          boostValEls[st].textContent = (s.boosts[st] > 0 ? '+' : '') + s.boosts[st];
          boostValEls[st].className = 'boost-val' + (s.boosts[st] !== 0 ? ' nonzero' : '');
        }
      });
      evTotalEl.textContent = total + ' / 508 EVs used';
      evTotalEl.className = 'ev-total' + (total > 508 ? ' over' : '');
    }

    function renderBadges() {
      badges.innerHTML = '';
      var items = [];
      STAT_ORDER.forEach(function (st) {
        if (st !== 'hp' && s.boosts[st] !== 0) items.push(STAT_LABEL[st] + ' ' + (s.boosts[st] > 0 ? '+' : '') + s.boosts[st]);
      });
      if (s.boosts.accuracy) items.push('Acc ' + (s.boosts.accuracy > 0 ? '+' : '') + s.boosts.accuracy);
      if (s.boosts.evasion) items.push('Eva ' + (s.boosts.evasion > 0 ? '+' : '') + s.boosts.evasion);
      if (s.status) {
        var lbl = STATUS_OPTS.filter(function (o) { return o.id === s.status; })[0];
        if (lbl) items.push(lbl.label);
      }
      if (s.teraType) items.push('Tera ' + s.teraType);
      if (s.isDynamaxed) items.push('Dynamaxed');
      if (s.powerTrick) items.push('Power Trick');
      if (s.curHPPercent < 100) items.push(s.curHPPercent + '% HP');
      items.forEach(function (t) { badges.appendChild(el('span', { class: 'mod-badge', text: t })); });
    }

    // ---------- moves (4 clickable slots, click = calculate this mon attacking the other side) ----------
    // ---------- accuracy / evasion stages ----------
    var accEvaBlock = el('div', { class: 'acc-eva-block' });
    function buildAccEvaRow(label, key) {
      var row = el('div', { class: 'acc-eva-row' });
      row.appendChild(el('span', { class: 'acc-eva-label', text: label }));
      var stepper = el('div', { class: 'boost-stepper' });
      var minus = el('button', { text: '\u2212' });
      var valEl = el('span', { class: 'boost-val' + (s.boosts[key] !== 0 ? ' nonzero' : ''), text: (s.boosts[key] > 0 ? '+' : '') + s.boosts[key] });
      var plus = el('button', { text: '+' });
      function refresh() {
        valEl.textContent = (s.boosts[key] > 0 ? '+' : '') + s.boosts[key];
        valEl.className = 'boost-val' + (s.boosts[key] !== 0 ? ' nonzero' : '');
      }
      minus.addEventListener('click', function () { s.boosts[key] = clamp(s.boosts[key] - 1, -6, 6); refresh(); renderBadges(); recalc(); });
      plus.addEventListener('click', function () { s.boosts[key] = clamp(s.boosts[key] + 1, -6, 6); refresh(); renderBadges(); recalc(); });
      stepper.appendChild(minus); stepper.appendChild(valEl); stepper.appendChild(plus);
      row.appendChild(stepper);
      return row;
    }
    accEvaBlock.appendChild(buildAccEvaRow('Accuracy stage', 'accuracy'));
    accEvaBlock.appendChild(buildAccEvaRow('Evasion stage', 'evasion'));
    panel.appendChild(accEvaBlock);

    var movesWrap = el('div', { class: 'moves-section' });
    movesWrap.appendChild(el('div', { class: 'side-label', text: 'Moves' }));
    var movesGrid = el('div', { class: 'moves-grid' });
    movesWrap.appendChild(movesGrid);
    panel.appendChild(movesWrap);

    var slotEls = [];

    function renderMoveSlot(i) {
      var slotState = s.moves[i];
      var mv = slotState.name ? gen.moves.get(C.toID(slotState.name)) : null;
      var isActive = state.activeSlot.side === key && state.activeSlot.index === i;

      var slotWrap = el('div', { class: 'move-slot' + (isActive ? ' active' : '') });

      var btn = el('button', { class: 'move-slot-btn' });
      if (mv) {
        btn.style.borderLeftColor = TYPE_COLORS[mv.type] || '#888';
        btn.appendChild(el('span', { class: 'move-slot-name', text: slotState.name }));
        btn.appendChild(el('span', {
          class: 'move-slot-meta',
          text: (mv.category || 'Status') + ' \u00b7 ' + (mv.basePower || '\u2014') +
            ' \u00b7 ' + (function () { var a = getBaseAccuracy(slotState.name); return a === true ? '\u2014% acc' : (a == null ? '' : a + '% acc'); })() +
            (mv.multihit ? ' \u00b7 multi-hit' : '')
        }));
      } else {
        btn.appendChild(el('span', { class: 'move-slot-name empty', text: '(empty slot)' }));
      }
      btn.addEventListener('click', function () {
        if (!slotState.name) { editBtn.click(); return; }
        state.activeSlot = { side: key, index: i };
        refreshAllActiveHighlights();
        recalc();
      });
      slotWrap.appendChild(btn);

      var editBtn = el('button', { class: 'move-slot-edit', text: '\u270e', title: 'Change move' });
      slotWrap.appendChild(editBtn);

      var comboHolder = el('div', { class: 'move-slot-combo-holder' });
      var moveCombo = combobox({
        value: slotState.name || '', placeholder: 'Search move\u2026',
        getOptions: function (q) {
          var qid = C.toID(q);
          var out = [];
          for (var mv2 of gen.moves) {
            if (!qid || C.toID(mv2.name).indexOf(qid) !== -1) {
              out.push({ id: mv2.name, label: mv2.name, meta: mv2.type + (mv2.basePower ? ' \u00b7 ' + mv2.basePower + 'BP' : ' \u00b7 status') });
            }
          }
          return out;
        },
        onSelect: function (id) {
          slotState.name = id;
          slotState.hits = null;
          rebuildMovesGrid();
          if (isActive) recalc();
        }
      });
      comboHolder.appendChild(moveCombo);
      slotWrap.appendChild(comboHolder);

      editBtn.addEventListener('click', function () {
        comboHolder.classList.toggle('open');
      });

      // multi-hit override: Population Bomb stores multihit as a plain max (10),
      // Icicle Spear/Rock Blast/Bullet Seed etc. store it as a [min,max] range.
      // Both are overridable via the same `hits` option - show the control for either shape.
      if (mv && mv.multihit) {
        var maxHits = Array.isArray(mv.multihit) ? mv.multihit[1] : mv.multihit;
        var minHits = Array.isArray(mv.multihit) ? mv.multihit[0] : 1;
        var hitsWrap = el('div', { class: 'hits-override' });
        hitsWrap.appendChild(el('span', { class: 'hits-label', text: 'Hits landed' }));
        var hitsInput = el('input', {
          type: 'number', min: String(minHits), max: String(maxHits),
          value: String(slotState.hits || maxHits)
        });
        hitsInput.addEventListener('input', function () {
          slotState.hits = clamp(parseInt(hitsInput.value, 10) || maxHits, minHits, maxHits);
          if (isActive) recalc();
        });
        hitsWrap.appendChild(hitsInput);
        hitsWrap.appendChild(el('span', { class: 'hits-max', text: '/ ' + maxHits + ' max' }));
        slotWrap.appendChild(hitsWrap);
      }

      return slotWrap;
    }

    function rebuildMovesGrid() {
      movesGrid.innerHTML = '';
      slotEls = [];
      for (var i = 0; i < 4; i++) {
        var slotEl = renderMoveSlot(i);
        slotEls.push(slotEl);
        movesGrid.appendChild(slotEl);
      }
    }
    rebuildMovesGrid();

    renderStats();
    renderBadges();
    container.appendChild(panel);
    container._api = { renderStats: renderStats, renderBadges: renderBadges, rebuildMovesGrid: rebuildMovesGrid, updateAttackingBadge: updateAttackingBadge, renderWeatherToggle: renderWeatherToggle };
  }

  function refreshAllActiveHighlights() {
    ['left', 'right'].forEach(function (k) {
      var c = document.getElementById('panel-' + k);
      if (c && c._api) { c._api.rebuildMovesGrid(); c._api.updateAttackingBadge(); }
    });
    renderMoveStripMeta();
  }

  function refreshAllWeatherToggles() {
    ['left', 'right'].forEach(function (k) {
      var c = document.getElementById('panel-' + k);
      if (c && c._api) c._api.renderWeatherToggle();
    });
  }

  // ---------- summary (read-only readout of every non-default modifier, placed under the result) ----------
  function renderSummary() {
    var container = document.getElementById('summary');
    if (!container) return;
    container.innerHTML = '';
    var box = el('div', { class: 'summary-panel' });
    box.appendChild(el('div', { class: 'summary-panel-label', text: 'Active modifiers (anything not shown here is at default)' }));

    var any = false;
    var wrap = el('div', { class: 'summary-wrap' });

    ['left', 'right'].forEach(function (key) {
      var s = state[key];
      var items = [];
      STAT_ORDER.forEach(function (st) {
        if (st !== 'hp' && s.boosts[st] !== 0) items.push(STAT_LABEL[st] + ' ' + (s.boosts[st] > 0 ? '+' : '') + s.boosts[st]);
      });
      if (s.boosts.accuracy) items.push('Acc ' + (s.boosts.accuracy > 0 ? '+' : '') + s.boosts.accuracy);
      if (s.boosts.evasion) items.push('Eva ' + (s.boosts.evasion > 0 ? '+' : '') + s.boosts.evasion);
      if (s.status) {
        var lbl = STATUS_OPTS.filter(function (o) { return o.id === s.status; })[0];
        if (lbl) items.push(lbl.label);
      }
      if (s.teraType) items.push('Tera ' + s.teraType);
      if (s.isDynamaxed) items.push('Dynamaxed');
      if (s.powerTrick) items.push('Power Trick');
      if (s.curHPPercent < 100) items.push(s.curHPPercent + '% HP');
      if (items.length) any = true;
      var col = el('div', { class: 'summary-col' });
      col.appendChild(el('div', { class: 'side-label ' + (key === 'left' ? 'attacker' : 'defender'), text: key === 'left' ? 'Pok\u00e9mon 1' : 'Pok\u00e9mon 2' }));
      var badgeRow = el('div', { class: 'mod-badges' });
      if (items.length) {
        items.forEach(function (t) { badgeRow.appendChild(el('span', { class: 'mod-badge', text: t })); });
      } else {
        badgeRow.appendChild(el('span', { class: 'summary-none', text: 'all default' }));
      }
      col.appendChild(badgeRow);
      wrap.appendChild(col);
    });

    var fieldItems = buildFieldBadgeItems();
    if (state.forceCrit) fieldItems.unshift('Critical hit');
    if (fieldItems.length) any = true;
    var fieldCol = el('div', { class: 'summary-col' });
    fieldCol.appendChild(el('div', { class: 'side-label', text: 'Field' }));
    var fieldBadgeRow = el('div', { class: 'mod-badges' });
    if (fieldItems.length) {
      fieldItems.forEach(function (t) { fieldBadgeRow.appendChild(el('span', { class: 'mod-badge', text: t })); });
    } else {
      fieldBadgeRow.appendChild(el('span', { class: 'summary-none', text: 'all default' }));
    }
    fieldCol.appendChild(fieldBadgeRow);
    wrap.appendChild(fieldCol);

    box.appendChild(wrap);
    container.appendChild(box);
  }

  // ---------- swap control + active-move summary ----------
  var moveStripMetaEl = null;

  function renderMoveStripMeta() {
    if (!moveStripMetaEl) return;
    var activeMon = state[state.activeSlot.side];
    var activeMv = activeMon.moves[state.activeSlot.index];
    var mv = activeMv && activeMv.name ? gen.moves.get(C.toID(activeMv.name)) : null;
    moveStripMetaEl.innerHTML = '';
    if (!mv) { moveStripMetaEl.textContent = 'Click a move on either side to calculate'; return; }
    var whoLabel = state.activeSlot.side === 'left' ? 'Pok\u00e9mon 1' : 'Pok\u00e9mon 2';
    moveStripMetaEl.appendChild(el('span', { class: 'move-meta-who', text: whoLabel + ' uses ' + activeMv.name }));
    var badge = el('span', { class: 'type-badge', style: 'background:' + (TYPE_COLORS[mv.type] || '#888'), text: mv.type });
    moveStripMetaEl.appendChild(badge);
    moveStripMetaEl.appendChild(document.createTextNode((mv.category || 'Status') + ' \u00b7 ' + (mv.basePower || '\u2014') + ' BP'));
  }

  function buildMoveStrip(container) {
    container.innerHTML = '';
    var strip = el('div', { class: 'move-strip' });

    moveStripMetaEl = el('div', { class: 'move-meta' });
    strip.appendChild(moveStripMetaEl);
    renderMoveStripMeta();

    var critWrap = el('label', { class: 'crit-toggle' });
    var critCheck = el('input', { type: 'checkbox' });
    critCheck.checked = state.forceCrit;
    critCheck.addEventListener('change', function () { state.forceCrit = critCheck.checked; recalc(); });
    critWrap.appendChild(critCheck);
    critWrap.appendChild(document.createTextNode('Assume critical hit'));
    strip.appendChild(critWrap);

    var swapBtn = el('button', { class: 'swap-btn', text: '\u21c4 Swap sides' });
    swapBtn.addEventListener('click', function () {
      var tmp = state.left; state.left = state.right; state.right = tmp;
      state.activeSlot.side = state.activeSlot.side === 'left' ? 'right' : 'left';
      buildSidePanel(document.getElementById('panel-left'), 'left', 'Pok\u00e9mon 1');
      buildSidePanel(document.getElementById('panel-right'), 'right', 'Pok\u00e9mon 2');
      renderMoveStripMeta();
      recalc();
    });
    strip.appendChild(swapBtn);

    container.appendChild(strip);
  }

  function buildFieldBadgeItems() {
    var f = state.field;
    var items = [];
    if (f.weather !== 'None') items.push(f.weather);
    if (f.terrain !== 'None') items.push(f.terrain + ' Terrain');
    if (f.gravity) items.push('Gravity');
    if (f.doubles) items.push('Doubles');
    if (f.defScreens.reflect) items.push('Reflect');
    if (f.defScreens.lightScreen) items.push('Light Screen');
    if (f.defScreens.auroraVeil) items.push('Aurora Veil');
    if (f.defHazards.stealthRock) items.push('Stealth Rock');
    if (f.defHazards.spikes > 0) items.push('Spikes x' + f.defHazards.spikes);
    if (f.rooms.wonderRoom) items.push('Wonder Room');
    if (f.rooms.magicRoom) items.push('Magic Room');
    if (f.defExtra.protected) items.push('Protect');
    if (f.defExtra.saltCured) items.push('Salt Cure');
    if (f.defExtra.foresight) items.push('Foresight');
    if (f.defExtra.gmaxHazard !== 'None') items.push(f.defExtra.gmaxHazard);
    if (f.doubles) {
      if (f.allyAtk.helpingHand) items.push('Ally Helping Hand');
      if (f.allyAtk.battery) items.push('Ally Battery');
      if (f.allyAtk.powerSpot) items.push('Ally Power Spot');
      if (f.allyAtk.steelySpirit) items.push('Ally Steely Spirit');
      if (f.allyAtk.flowerGift) items.push('Ally Flower Gift');
      if (f.allyDef.friendGuard) items.push('Ally Friend Guard');
      if (f.allyAbilities.swordOfRuin) items.push('Ally Sword of Ruin');
      if (f.allyAbilities.beadsOfRuin) items.push('Ally Beads of Ruin');
      if (f.allyAbilities.tabletsOfRuin) items.push('Ally Tablets of Ruin');
      if (f.allyAbilities.vesselOfRuin) items.push('Ally Vessel of Ruin');
      if (f.allyAbilities.fairyAura) items.push('Ally Fairy Aura');
      if (f.allyAbilities.darkAura) items.push('Ally Dark Aura');
      if (f.allyAbilities.auraBreak) items.push('Ally Aura Break');
    }
    return items;
  }

  // ---------- field conditions ----------
  function buildConditions(container) {
    container.innerHTML = '';
    var box = el('div', { class: 'conditions' });
    box.appendChild(el('div', { class: 'conditions-label', text: 'Field conditions' }));

    var condBadges = el('div', { class: 'mod-badges' });

    function renderCondBadges() {
      condBadges.innerHTML = '';
      buildFieldBadgeItems().forEach(function (t) { condBadges.appendChild(el('span', { class: 'mod-badge', text: t })); });
    }

    var weatherWrap = el('div', { class: 'field' });
    weatherWrap.appendChild(el('label', { text: 'Weather' }));
    var weatherSel = el('select', {});
    WEATHERS.forEach(function (w) {
      var o = el('option', { value: w, text: w });
      if (w === state.field.weather) o.selected = true;
      weatherSel.appendChild(o);
    });
    weatherSel.addEventListener('change', function () { state.field.weather = weatherSel.value; renderCondBadges(); refreshAllWeatherToggles(); recalc(); });
    weatherWrap.appendChild(weatherSel);
    box.appendChild(weatherWrap);

    var terrainWrap = el('div', { class: 'field' });
    terrainWrap.appendChild(el('label', { text: 'Terrain' }));
    var terrainSel = el('select', {});
    TERRAINS.forEach(function (t) {
      var o = el('option', { value: t, text: t });
      if (t === state.field.terrain) o.selected = true;
      terrainSel.appendChild(o);
    });
    terrainSel.addEventListener('change', function () { state.field.terrain = terrainSel.value; renderCondBadges(); recalc(); });
    terrainWrap.appendChild(terrainSel);
    box.appendChild(terrainWrap);

    var checks = el('div', { class: 'checks' });
    function check(label, getter, setter) {
      var id = 'chk-' + label.replace(/\s+/g, '');
      var input = el('input', { type: 'checkbox', id: id });
      input.checked = getter();
      input.addEventListener('change', function () { setter(input.checked); renderCondBadges(); recalc(); });
      var lbl = el('label', { for: id }, [input, document.createTextNode(label)]);
      checks.appendChild(lbl);
    }
    check('Gravity', function () { return state.field.gravity; }, function (v) { state.field.gravity = v; });
    var doublesId = 'chk-Doubles';
    var doublesInput = el('input', { type: 'checkbox', id: doublesId });
    doublesInput.checked = state.field.doubles;
    doublesInput.addEventListener('change', function () {
      state.field.doubles = doublesInput.checked;
      buildConditions(document.getElementById('conditions'));
      recalc();
    });
    checks.appendChild(el('label', { for: doublesId }, [doublesInput, document.createTextNode('Doubles')]));
    check('Reflect', function () { return state.field.defScreens.reflect; }, function (v) { state.field.defScreens.reflect = v; });
    check('Light Screen', function () { return state.field.defScreens.lightScreen; }, function (v) { state.field.defScreens.lightScreen = v; });
    check('Aurora Veil', function () { return state.field.defScreens.auroraVeil; }, function (v) { state.field.defScreens.auroraVeil = v; });
    check('Stealth Rock', function () { return state.field.defHazards.stealthRock; }, function (v) { state.field.defHazards.stealthRock = v; });
    check('Wonder Room', function () { return state.field.rooms.wonderRoom; }, function (v) { state.field.rooms.wonderRoom = v; });
    check('Magic Room', function () { return state.field.rooms.magicRoom; }, function (v) { state.field.rooms.magicRoom = v; });
    check('Protect', function () { return state.field.defExtra.protected; }, function (v) { state.field.defExtra.protected = v; });
    check('Salt Cure', function () { return state.field.defExtra.saltCured; }, function (v) { state.field.defExtra.saltCured = v; });
    check('Foresight', function () { return state.field.defExtra.foresight; }, function (v) { state.field.defExtra.foresight = v; });
    box.appendChild(checks);

    var spikesWrap = el('div', { class: 'field' });
    spikesWrap.appendChild(el('label', { text: 'Spikes' }));
    var spikesSel = el('select', {});
    [0, 1, 2, 3].forEach(function (n) {
      var o = el('option', { value: String(n), text: n === 0 ? 'None' : (n + ' layer' + (n > 1 ? 's' : '')) });
      if (state.field.defHazards.spikes === n) o.selected = true;
      spikesSel.appendChild(o);
    });
    spikesSel.addEventListener('change', function () { state.field.defHazards.spikes = parseInt(spikesSel.value, 10); renderCondBadges(); recalc(); });
    spikesWrap.appendChild(spikesSel);
    box.appendChild(spikesWrap);

    var gmaxWrap = el('div', { class: 'field' });
    gmaxWrap.appendChild(el('label', { text: 'G-Max residual' }));
    var gmaxSel = el('select', {});
    ['None', 'Steelsurge', 'Vine Lash', 'Wildfire', 'Cannonade', 'Volcalith'].forEach(function (v) {
      var o = el('option', { value: v, text: v });
      if (state.field.defExtra.gmaxHazard === v) o.selected = true;
      gmaxSel.appendChild(o);
    });
    gmaxSel.addEventListener('change', function () { state.field.defExtra.gmaxHazard = gmaxSel.value; renderCondBadges(); recalc(); });
    gmaxWrap.appendChild(gmaxSel);
    box.appendChild(gmaxWrap);

    if (state.field.doubles) {
      var allyChecks = el('div', { class: 'checks' });
      allyChecks.appendChild(el('div', { class: 'conditions-label', text: 'Ally support (attacker\u2019s partner)' }));
      function allyCheck(target, label, key) {
        var id = 'chk-ally-' + key;
        var input = el('input', { type: 'checkbox', id: id });
        input.checked = target[key];
        input.addEventListener('change', function () { target[key] = input.checked; renderCondBadges(); recalc(); });
        allyChecks.appendChild(el('label', { for: id }, [input, document.createTextNode(label)]));
      }
      allyCheck(state.field.allyAtk, 'Helping Hand', 'helpingHand');
      allyCheck(state.field.allyAtk, 'Battery (ally)', 'battery');
      allyCheck(state.field.allyAtk, 'Power Spot (ally)', 'powerSpot');
      allyCheck(state.field.allyAtk, 'Steely Spirit (ally)', 'steelySpirit');
      allyCheck(state.field.allyAtk, 'Flower Gift (ally, in sun)', 'flowerGift');
      box.appendChild(allyChecks);

      var ruinChecks = el('div', { class: 'checks' });
      ruinChecks.appendChild(el('div', { class: 'conditions-label', text: 'Ruin / Aura abilities (an ally has it \u2014 if the attacker/defender itself has it, just pick it as their ability instead)' }));
      allyCheck(state.field.allyAbilities, 'Sword of Ruin', 'swordOfRuin');
      allyCheck(state.field.allyAbilities, 'Beads of Ruin', 'beadsOfRuin');
      allyCheck(state.field.allyAbilities, 'Tablets of Ruin', 'tabletsOfRuin');
      allyCheck(state.field.allyAbilities, 'Vessel of Ruin', 'vesselOfRuin');
      allyCheck(state.field.allyAbilities, 'Fairy Aura', 'fairyAura');
      allyCheck(state.field.allyAbilities, 'Dark Aura', 'darkAura');
      allyCheck(state.field.allyAbilities, 'Aura Break', 'auraBreak');
      box.appendChild(ruinChecks);

      var allyDefChecks = el('div', { class: 'checks' });
      allyDefChecks.appendChild(el('div', { class: 'conditions-label', text: 'Ally support (defender\u2019s partner)' }));
      allyCheck(state.field.allyDef, 'Friend Guard (ally)', 'friendGuard');
      box.appendChild(allyDefChecks);
    }

    box.appendChild(condBadges);
    renderCondBadges();

    container.appendChild(box);
  }

  // ---------- result ----------
  function buildResultShell(container) {
    container.innerHTML = '';
    var box = el('div', { class: 'result' });
    box.id = 'result-inner';
    container.appendChild(box);
  }

  function pokemonFromState(s) {
    var opts = {
      level: s.level,
      item: s.item || undefined,
      ability: s.ability || undefined,
      nature: s.nature,
      status: s.status || undefined,
      teraType: s.teraType || undefined,
      isDynamaxed: !!s.isDynamaxed,
      ivs: s.ivs,
      evs: s.evs,
      boosts: s.boosts
    };
    var base = new C.Pokemon(gen, s.species, opts);
    if (s.curHPPercent != null && s.curHPPercent < 100) {
      var abs = Math.max(1, Math.round(base.maxHP() * s.curHPPercent / 100));
      opts.curHP = abs;
      return new C.Pokemon(gen, s.species, opts);
    }
    return base;
  }

  var GMAX_HAZARD_KEY = { 'Steelsurge': 'steelsurge', 'Vine Lash': 'vinelash', 'Wildfire': 'wildfire', 'Cannonade': 'cannonade', 'Volcalith': 'volcalith' };

  function buildField(atkKey, defKey) {
    var f = state.field;
    var gmaxKey = GMAX_HAZARD_KEY[f.defExtra.gmaxHazard];
    var defenderSide = {
      isReflect: f.defScreens.reflect,
      isLightScreen: f.defScreens.lightScreen,
      isAuroraVeil: f.defScreens.auroraVeil,
      isSR: f.defHazards.stealthRock,
      spikes: f.defHazards.spikes,
      isFriendGuard: f.doubles && f.allyDef.friendGuard,
      isProtected: f.defExtra.protected,
      isSaltCured: f.defExtra.saltCured,
      isForesight: f.defExtra.foresight,
      isPowerTrick: defKey ? !!state[defKey].powerTrick : false
    };
    if (gmaxKey) defenderSide[gmaxKey] = true;
    var field = new C.Field({
      gameType: f.doubles ? 'Doubles' : 'Singles',
      weather: f.weather === 'None' ? undefined : f.weather,
      terrain: f.terrain === 'None' ? undefined : f.terrain,
      isGravity: f.gravity,
      isWonderRoom: f.rooms.wonderRoom,
      isMagicRoom: f.rooms.magicRoom,
      isSwordOfRuin: f.doubles && f.allyAbilities.swordOfRuin,
      isBeadsOfRuin: f.doubles && f.allyAbilities.beadsOfRuin,
      isTabletsOfRuin: f.doubles && f.allyAbilities.tabletsOfRuin,
      isVesselOfRuin: f.doubles && f.allyAbilities.vesselOfRuin,
      isFairyAura: f.doubles && f.allyAbilities.fairyAura,
      isDarkAura: f.doubles && f.allyAbilities.darkAura,
      isAuraBreak: f.doubles && f.allyAbilities.auraBreak,
      defenderSide: defenderSide,
      attackerSide: {
        isHelpingHand: f.doubles && f.allyAtk.helpingHand,
        isBattery: f.doubles && f.allyAtk.battery,
        isPowerSpot: f.doubles && f.allyAtk.powerSpot,
        isSteelySpirit: f.doubles && f.allyAtk.steelySpirit,
        isFlowerGift: f.doubles && f.allyAtk.flowerGift,
        isPowerTrick: atkKey ? !!state[atkKey].powerTrick : false
      }
    });
    return field;
  }

  function recalc() {
    var out = document.getElementById('result-inner');
    if (!out) return;
    out.innerHTML = '';
    try {
      var atkKey = state.activeSlot.side;
      var defKey = atkKey === 'left' ? 'right' : 'left';
      var activeMoveState = state[atkKey].moves[state.activeSlot.index];
      if (!activeMoveState || !activeMoveState.name) {
        out.appendChild(el('div', { class: 'result-error', text: 'Click a move on either side to calculate.' }));
        return;
      }
      var attacker = pokemonFromState(state[atkKey]);
      var defender = pokemonFromState(state[defKey]);
      var moveOpts = {};
      if (activeMoveState.hits) moveOpts.hits = activeMoveState.hits;
      if (state.forceCrit) moveOpts.isCrit = true;
      var move = new C.Move(gen, activeMoveState.name, moveOpts);
      var field = buildField(atkKey, defKey);
      var result = C.calculate(gen, attacker, defender, move, field);

      var range = result.range ? result.range() : [0, 0];
      var maxHP = defender.maxHP();
      var pctLo = maxHP ? (range[0] / maxHP * 100) : 0;
      var pctHi = maxHP ? (range[1] / maxHP * 100) : 0;

      var accInfo = computeAccuracyInfo(activeMoveState.name, state[atkKey], state[defKey]);
      if (accInfo.cantMiss || accInfo.base === true) {
        out.appendChild(el('div', { class: 'result-acc', text: 'Accuracy: can\u2019t miss' + (accInfo.notes.length ? ' (' + accInfo.notes.join(', ') + ')' : '') }));
      } else if (accInfo.unknown) {
        out.appendChild(el('div', { class: 'result-acc dim', text: 'Accuracy: unknown for this move/gen' }));
      } else {
        var accText = accInfo.effective === accInfo.base
          ? 'Accuracy: ' + accInfo.base + '%'
          : 'Accuracy: ' + accInfo.base + '% \u2192 ' + accInfo.effective + '% (' + accInfo.notes.join(', ') + ')';
        out.appendChild(el('div', { class: 'result-acc' + (accInfo.effective !== accInfo.base ? ' modified' : ''), text: accText }));
      }

      var top = el('div', { class: 'result-top' }, [
        el('div', { class: 'result-pct', text: pctLo.toFixed(1) + '\u2013' + pctHi.toFixed(1) + '%' }),
        (function () {
          var koText = '';
          try { koText = result.kochance().text; } catch (e) { koText = ''; }
          var isLethal = /guaranteed|OHKO/i.test(koText);
          return el('div', { class: 'result-ko' + (isLethal ? ' lethal' : ''), text: koText || '\u2014' });
        })()
      ]);
      out.appendChild(top);

      var hpWrap = el('div', { class: 'hp-bar-wrap' });
      var loWidth = clamp(pctLo, 0, 100);
      var rangeWidth = clamp(pctHi - pctLo, 0, 100 - loWidth);
      var guaranteed = el('div', { class: 'dmg-guaranteed', style: 'width:' + loWidth + '%' });
      var rangeBarEl = el('div', { class: 'dmg-range', style: 'left:' + loWidth + '%;width:' + rangeWidth + '%' });
      hpWrap.appendChild(guaranteed);
      hpWrap.appendChild(rangeBarEl);
      out.appendChild(hpWrap);

      var desc = '';
      try { desc = result.desc(); } catch (e) {
        desc = (range[0] === 0 && range[1] === 0)
          ? 'No damage dealt (blocked, immune, or otherwise negated this hit).'
          : (result.rawDesc ? JSON.stringify(result.rawDesc) : 'Could not generate a description for this matchup.');
      }
      out.appendChild(el('div', { class: 'result-desc', text: desc }));
    } catch (err) {
      out.appendChild(el('div', { class: 'result-error', text: 'Calculation error: ' + err.message }));
    }
    renderSummary();
  }

  // ---------- generation compatibility ----------
  function speciesExists(name) { return !!gen.species.get(C.toID(name)); }
  function moveExists(name) { return !!gen.moves.get(C.toID(name)); }
  function itemExists(name) { return !!gen.items.get(C.toID(name)); }
  function abilityExists(name) { return !!gen.abilities.get(C.toID(name)); }

  function sanitizeStateForGen() {
    ['left', 'right'].forEach(function (key) {
      var s = state[key];
      if (!speciesExists(s.species)) {
        state[key] = defaultMon('Bulbasaur');
        return;
      }
      if (s.item && !itemExists(s.item)) s.item = '';
      if (s.ability && !abilityExists(s.ability)) s.ability = '';
      if (GEN_NUM < 9) s.teraType = '';
      if (GEN_NUM !== 8) s.isDynamaxed = false;
      s.moves.forEach(function (m) {
        if (m.name && !moveExists(m.name)) { m.name = ''; m.hits = null; }
      });
    });
  }

  // ---------- generation selector ----------
  // ---------- shareable state (URL hash) ----------
  function b64EncodeUnicode(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }
  function b64DecodeUnicode(str) {
    return decodeURIComponent(escape(atob(str)));
  }

  function serializeState() {
    var payload = {
      v: 1, gen: GEN_NUM,
      left: state.left, right: state.right, field: state.field,
      activeSlot: state.activeSlot, forceCrit: state.forceCrit
    };
    return b64EncodeUnicode(JSON.stringify(payload));
  }

  function buildShareUrl() {
    var base = location.href.split('#')[0];
    return base + '#s=' + serializeState();
  }

  function loadStateFromHash() {
    var hash = location.hash || '';
    var m = hash.match(/#s=(.+)$/);
    if (!m) return false;
    var payload;
    try { payload = JSON.parse(b64DecodeUnicode(decodeURIComponent(m[1]))); } catch (e) { return false; }
    if (!payload || !payload.left || !payload.right) return false;
    try {
      GEN_NUM = payload.gen || 9;
      gen = C.Generations.get(GEN_NUM);
      state.left = payload.left;
      state.right = payload.right;
      state.field = payload.field || state.field;
      state.activeSlot = payload.activeSlot || { side: 'left', index: 0 };
      state.forceCrit = !!payload.forceCrit;
      sanitizeStateForGen();
      return true;
    } catch (e) { return false; }
  }

  function buildShareControl(container) {
    container.innerHTML = '';
    var btn = el('button', { class: 'reset-btn', text: 'Share' });
    var status = el('span', { class: 'share-status' });
    btn.addEventListener('click', function () {
      var url = buildShareUrl();
      history.replaceState(null, '', url);
      var done = function () { status.textContent = 'Copied!'; setTimeout(function () { status.textContent = ''; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done, function () {
          window.prompt('Copy this link:', url);
        });
      } else {
        window.prompt('Copy this link:', url);
      }
    });
    container.appendChild(btn);
    container.appendChild(status);
  }

  function rebuildAll() {
    buildSidePanel(document.getElementById('panel-left'), 'left', 'Pok\u00e9mon 1');
    buildSidePanel(document.getElementById('panel-right'), 'right', 'Pok\u00e9mon 2');
    renderMoveStripMeta();
    buildConditions(document.getElementById('conditions'));
    recalc();
  }

  function buildGenSelector(container) {
    container.innerHTML = '';
    var wrap = el('div', { class: 'gen-select' });
    wrap.appendChild(el('span', { text: 'Generation' }));
    var sel = el('select', {});
    for (var i = 9; i >= 1; i--) {
      var o = el('option', { value: String(i), text: 'Gen ' + i });
      if (i === GEN_NUM) o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener('change', function () {
      GEN_NUM = parseInt(sel.value, 10);
      gen = C.Generations.get(GEN_NUM);
      sanitizeStateForGen();
      rebuildAll();
    });
    wrap.appendChild(sel);
    container.appendChild(wrap);
  }

  // ---------- boot ----------
  document.addEventListener('DOMContentLoaded', function () {
    loadAccuracyTable();
    loadStateFromHash();
    buildGenSelector(document.getElementById('gen-select-holder'));
    buildShareControl(document.getElementById('share-holder'));
    buildSidePanel(document.getElementById('panel-left'), 'left', 'Pok\u00e9mon 1');
    buildSidePanel(document.getElementById('panel-right'), 'right', 'Pok\u00e9mon 2');
    buildMoveStrip(document.getElementById('move-strip'));
    buildConditions(document.getElementById('conditions'));
    buildResultShell(document.getElementById('result'));
    recalc();

    var tabBtns = document.querySelectorAll('.tab-btn');
    tabBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        tabBtns.forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var tab = btn.getAttribute('data-tab');
        document.getElementById('view-calc').style.display = tab === 'calc' ? '' : 'none';
        document.getElementById('view-battle').style.display = tab === 'battle' ? '' : 'none';
        document.getElementById('gen-select-holder').style.display = tab === 'calc' ? '' : 'none';
        if (tab === 'battle' && window.BattlePlanner && !window.BattlePlanner.booted) {
          window.BattlePlanner.boot();
        }
      });
    });

    if (location.hash.indexOf('#bp=') === 0 && window.BattlePlanner) {
      var battleTabBtn = [...tabBtns].filter(function (b) { return b.getAttribute('data-tab') === 'battle'; })[0];
      if (battleTabBtn) battleTabBtn.click();
    }
  });
})();

</script>
<script>
window.BattlePlanner = (function () {
  'use strict';

  var C = window.SmogonCalc;
  var GEN_NUM = 9;
  var gen = C.Generations.get(GEN_NUM);
  var rootEl = null;
  var booted = false;

  var STAT_LABEL = { hp: 'HP', atk: 'Atk', def: 'Def', spa: 'SpA', spd: 'SpD', spe: 'Spe' };
  var STATUS_OPTS = [
    { id: '', label: 'Healthy' }, { id: 'brn', label: 'Burn' }, { id: 'par', label: 'Paralysis' },
    { id: 'psn', label: 'Poison' }, { id: 'tox', label: 'Bad Poison' },
    { id: 'slp', label: 'Sleep' }, { id: 'frz', label: 'Freeze' }
  ];

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (k === 'class') node.className = attrs[k];
      else if (k === 'text') node.textContent = attrs[k];
      else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // ---------- lightweight Showdown-paste team parser (multi-mon, no heavy engine needed) ----------
  var EV_IV_ABBR = { hp: 'hp', atk: 'atk', def: 'def', spa: 'spa', spd: 'spd', spe: 'spe' };

  function parseOneSet(lines) {
    if (!lines.length) return null;
    var result = {
      species: null, item: '', ability: '', level: 100, nature: 'Serious', teraType: '',
      evs: { hp: 0, atk: 0, def: 0, spa: 0, spd: 0, spe: 0 },
      ivs: { hp: 31, atk: 31, def: 31, spa: 31, spd: 31, spe: 31 },
      moves: []
    };
    var first = lines[0].replace(/\s*\((M|F)\)\s*$/, '');
    var atIdx = first.indexOf(' @ ');
    var namePart = atIdx === -1 ? first : first.slice(0, atIdx);
    if (atIdx !== -1) result.item = first.slice(atIdx + 3).trim();
    var parenMatch = namePart.match(/\(([^)]+)\)/);
    result.species = (parenMatch ? parenMatch[1] : namePart).trim();

    for (var i = 1; i < lines.length; i++) {
      var line = lines[i];
      var mm;
      if (/^ability:/i.test(line)) result.ability = line.split(':').slice(1).join(':').trim();
      else if (/^level:/i.test(line)) result.level = parseInt(line.split(':')[1], 10) || 100;
      else if (/^tera type:/i.test(line)) result.teraType = line.split(':').slice(1).join(':').trim();
      else if (/^evs:/i.test(line)) {
        line.slice(4).split('/').forEach(function (part) {
          var m2 = part.trim().match(/^(\d+)\s+(\w+)/);
          if (m2 && EV_IV_ABBR[m2[2].toLowerCase()]) result.evs[EV_IV_ABBR[m2[2].toLowerCase()]] = parseInt(m2[1], 10);
        });
      } else if (/^ivs:/i.test(line)) {
        line.slice(4).split('/').forEach(function (part) {
          var m2 = part.trim().match(/^(\d+)\s+(\w+)/);
          if (m2 && EV_IV_ABBR[m2[2].toLowerCase()]) result.ivs[EV_IV_ABBR[m2[2].toLowerCase()]] = parseInt(m2[1], 10);
        });
      } else if (/nature\s*$/i.test(line)) {
        result.nature = line.replace(/nature\s*$/i, '').trim();
      } else if (/^-\s*/.test(line)) {
        var moveName = line.replace(/^-\s*/, '').split('[')[0].trim();
        if (moveName && result.moves.length < 4) result.moves.push(moveName);
      }
    }
    return result.species ? result : null;
  }

  function parseTeam(text) {
    var chunks = text.split(/\n\s*\n/);
    var team = [];
    chunks.forEach(function (chunk) {
      var lines = chunk.split('\n').map(function (l) { return l.trim(); }).filter(function (l) { return l.length; });
      var set = parseOneSet(lines);
      if (set) team.push(set);
    });
    return team;
  }

  // ---------- gen data helpers ----------
  function speciesExists(name) { return !!gen.species.get(C.toID(name)); }
  function moveData(name) { return gen.moves.get(C.toID(name)); }

  var ACCURACY_TABLE = null;
  function getBaseAccuracy(moveName) {
    if (!ACCURACY_TABLE) return null;
    var table = ACCURACY_TABLE['gen' + GEN_NUM];
    if (!table) return null;
    var id = C.toID(moveName);
    return table.hasOwnProperty(id) ? table[id] : null;
  }
  function accStageToRatio(stage) {
    stage = clamp(stage, -6, 6);
    return stage >= 0 ? (3 + stage) / 3 : 3 / (3 - stage);
  }
  function computeAccuracy(moveName, atkMon, defMon, field) {
    var id = C.toID(moveName);
    var base = getBaseAccuracy(moveName);
    if (base === true || base === null) return { base: base, effective: null, cantMiss: base === true, unknown: base === null, notes: [] };
    var acc = base;
    var notes = [];
    var atkTpl = teamsData[atkMon.side][atkMon.tplIndex];
    var defTpl = teamsData[defMon.side][defMon.tplIndex];
    var atkAbility = C.toID(atkTpl.ability);
    var defAbility = C.toID(defTpl.ability);
    if (atkAbility === 'noguard' || defAbility === 'noguard') return { base: base, effective: 100, cantMiss: true, notes: ['No Guard'] };
    var stageDiff = clamp((atkMon.boosts.accuracy || 0) - (defMon.boosts.evasion || 0), -6, 6);
    if (stageDiff !== 0) { acc *= accStageToRatio(stageDiff); notes.push('acc/eva stages'); }
    if (field.gravity) { acc *= (GEN_NUM <= 4 ? 5 / 3 : 6840 / 4096); notes.push('Gravity'); }
    if (atkAbility === 'compoundeyes') { acc *= 1.3; notes.push('Compound Eyes'); }
    var mv = moveData(moveName);
    if (atkAbility === 'hustle' && mv && mv.category === 'Physical') { acc *= 0.8; notes.push('Hustle'); }
    if (defAbility === 'sandveil' && field.weather === 'Sand') { acc *= 0.8; notes.push('Sand Veil'); }
    if (defAbility === 'snowcloak' && field.weather === 'Snow') { acc *= 0.8; notes.push('Snow Cloak'); }
    var atkItem = C.toID(atkTpl.item), defItem = C.toID(defTpl.item);
    if (atkItem === 'widelens') { acc *= 1.1; notes.push('Wide Lens'); }
    if (defItem === 'brightpowder') { acc *= 0.9; notes.push('Bright Powder'); }
    if (defItem === 'laxincense') { acc *= 0.9; notes.push('Lax Incense'); }
    acc = clamp(Math.round(acc), 0, 100);
    return { base: base, effective: acc, cantMiss: false, notes: notes };
  }

  // ---------- team/format setup ----------
  var teamsData = { A: [], B: [] };
  var format = 'singles';

  // ---------- tree state ----------
  var nodes = {};
  var rootId = null;
  var currentId = null;
  var nodeSeq = 0;

  function newId() { nodeSeq++; return 'n' + nodeSeq; }

  function buildMonState(side, tplIndex) {
    var tpl = teamsData[side][tplIndex];
    var base = new C.Pokemon(gen, tpl.species, {
      level: tpl.level, item: tpl.item || undefined, ability: tpl.ability || undefined,
      nature: tpl.nature, ivs: tpl.ivs, evs: tpl.evs
    });
    return {
      side: side, tplIndex: tplIndex, maxHP: base.maxHP(), curHP: base.maxHP(),
      status: '', fainted: false,
      boosts: { atk: 0, def: 0, spa: 0, spd: 0, spe: 0, accuracy: 0, evasion: 0 }
    };
  }

  function makeRoot() {
    var leads = format === 'doubles' ? 2 : 1;
    var monsA = teamsData.A.map(function (_, i) { return buildMonState('A', i); });
    var monsB = teamsData.B.map(function (_, i) { return buildMonState('B', i); });
    var id = newId();
    nodes[id] = {
      id: id, parentId: null, label: 'Start',
      mons: { A: monsA, B: monsB },
      active: { A: monsA.slice(0, leads).map(function (_, i) { return i; }), B: monsB.slice(0, leads).map(function (_, i) { return i; }) },
      field: {
        weather: 'None', terrain: 'None', gravity: false,
        sideA: { reflect: false, lightScreen: false, auroraVeil: false, spikes: 0, stealthRock: false, helpingHand: false, battery: false, powerSpot: false, steelySpirit: false, flowerGift: false, friendGuard: false },
        sideB: { reflect: false, lightScreen: false, auroraVeil: false, spikes: 0, stealthRock: false, helpingHand: false, battery: false, powerSpot: false, steelySpirit: false, flowerGift: false, friendGuard: false }
      },
      children: []
    };
    rootId = id;
    currentId = id;
  }

  function cloneNodeState(node) {
    return JSON.parse(JSON.stringify({ mons: node.mons, active: node.active, field: node.field }));
  }

  function addChild(parentId, label, stateOverride) {
    var id = newId();
    var parent = nodes[parentId];
    var s = stateOverride || cloneNodeState(parent);
    nodes[id] = { id: id, parentId: parentId, label: label, mons: s.mons, active: s.active, field: s.field, children: [] };
    parent.children.push(id);
    return id;
  }

  function otherSide(side) { return side === 'A' ? 'B' : 'A'; }

  function pokemonFromMonState(monState) {
    var tpl = teamsData[monState.side][monState.tplIndex];
    var opts = {
      level: tpl.level, item: tpl.item || undefined, ability: tpl.ability || undefined,
      nature: tpl.nature, status: monState.status || undefined, teraType: tpl.teraType || undefined,
      ivs: tpl.ivs, evs: tpl.evs, boosts: monState.boosts
    };
    if (monState.curHP < monState.maxHP) opts.curHP = Math.max(1, monState.curHP);
    return new C.Pokemon(gen, tpl.species, opts);
  }

  function buildCalcField(node, attackerSide) {
    var defSideKey = otherSide(attackerSide) === 'A' ? 'sideA' : 'sideB';
    var atkSideKey = attackerSide === 'A' ? 'sideA' : 'sideB';
    var ds = node.field[defSideKey];
    var as = node.field[atkSideKey];
    return new C.Field({
      gameType: format === 'doubles' ? 'Doubles' : 'Singles',
      weather: node.field.weather === 'None' ? undefined : node.field.weather,
      terrain: node.field.terrain === 'None' ? undefined : node.field.terrain,
      isGravity: node.field.gravity,
      defenderSide: { isReflect: ds.reflect, isLightScreen: ds.lightScreen, isAuroraVeil: ds.auroraVeil, isSR: ds.stealthRock, spikes: ds.spikes, isFriendGuard: format === 'doubles' && ds.friendGuard },
      attackerSide: format === 'doubles' ? { isHelpingHand: as.helpingHand, isBattery: as.battery, isPowerSpot: as.powerSpot, isSteelySpirit: as.steelySpirit, isFlowerGift: as.flowerGift } : undefined
    });
  }

  function activeMonsOf(node, side) {
    return node.active[side].map(function (idx) { return node.mons[side][idx]; }).filter(function (m) { return m && !m.fainted; });
  }

  // ---------- rendering ----------
  function renderMonMini(monState) {
    var tpl = teamsData[monState.side][monState.tplIndex];
    var pct = monState.maxHP ? clamp(monState.curHP / monState.maxHP * 100, 0, 100) : 0;
    var color = pct > 50 ? '#3ea85a' : (pct > 20 ? '#e8c839' : '#f2434b');
    var card = el('div', { class: 'fc-mon-card' + (monState.fainted ? ' fainted' : '') });
    card.appendChild(el('div', { class: 'fc-mon-name', text: tpl.species + (monState.fainted ? ' (fainted)' : '') }));
    var barWrap = el('div', { class: 'hp-bar-wrap battle-hp-bar' });
    barWrap.appendChild(el('div', { style: 'position:absolute;inset:0;width:' + pct + '%;background:' + color + ';' }));
    card.appendChild(barWrap);
    card.appendChild(el('div', { class: 'battle-hp-text', text: monState.curHP + ' / ' + monState.maxHP + (monState.status ? ' \u00b7 ' + monState.status.toUpperCase() : '') }));
    var badges = el('div', { class: 'mod-badges' });
    ['atk', 'def', 'spa', 'spd', 'spe'].forEach(function (st) {
      if (monState.boosts[st]) badges.appendChild(el('span', { class: 'mod-badge', text: st.toUpperCase() + ' ' + (monState.boosts[st] > 0 ? '+' : '') + monState.boosts[st] }));
    });
    if (monState.boosts.accuracy) badges.appendChild(el('span', { class: 'mod-badge', text: 'Acc ' + (monState.boosts.accuracy > 0 ? '+' : '') + monState.boosts.accuracy }));
    if (monState.boosts.evasion) badges.appendChild(el('span', { class: 'mod-badge', text: 'Eva ' + (monState.boosts.evasion > 0 ? '+' : '') + monState.boosts.evasion }));
    card.appendChild(badges);
    return card;
  }

  function renderSideMonInfo(node, side, container) {

  // ---------- action panel: plan a full turn (every active Pok\u00e9mon on the field must act) ----------
  function sidesNeedingForcedSwitch(node) {
    var out = [];
    ['A', 'B'].forEach(function (side) {
      node.active[side].forEach(function (idx, slotN) {
        var m = node.mons[side][idx];
        if (m.fainted) {
          var bench = node.mons[side].filter(function (m2, i2) { return node.active[side].indexOf(i2) === -1 && !m2.fainted; });
          out.push({ side: side, slotN: slotN, activeIdx: idx, hasBench: bench.length > 0 });
        }
      });
    });
    return out;
  }

  function renderForcedSwitchPanel(node, forced, container) {
    container.innerHTML = '';
    container.appendChild(el('div', { class: 'battle-choice-label', text: 'A Pok\u00e9mon fainted \u2014 send out a replacement before continuing' }));
    forced.forEach(function (f) {
      var bench = node.mons[f.side].map(function (m, i) { return { m: m, i: i }; })
        .filter(function (x) { return node.active[f.side].indexOf(x.i) === -1 && !x.m.fainted; });
      var box = el('div', { class: 'fc-turn-col' });
      box.appendChild(el('div', { class: 'side-label ' + (f.side === 'A' ? 'attacker' : 'defender'), text: 'Team ' + f.side + ' \u2014 slot ' + (f.slotN + 1) + ' fainted' }));
      if (!bench.length) {
        box.appendChild(el('div', { class: 'fc-move-info', text: 'No Pok\u00e9mon left on the bench for Team ' + f.side + '.' }));
        container.appendChild(box);

      }
      var sel = el('select', {});
      bench.forEach(function (x) { sel.appendChild(el('option', { value: String(x.i), text: teamsData[f.side][x.m.tplIndex].species + ' (' + x.m.curHP + '/' + x.m.maxHP + ')' })); });
      box.appendChild(el('div', { class: 'field' }, [el('label', { text: 'Send out' }), sel]));

      btn.addEventListener('click', function () {

        s.active[f.side][f.slotN] = parseInt(sel.value, 10);

        renderAll();
      });
      box.appendChild(btn);
      container.appendChild(box);
