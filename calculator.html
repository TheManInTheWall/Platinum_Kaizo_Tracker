<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Damage Calc</title>
<style>
:root {
  --bg: #12141c;
  --panel: #1a1d28;
  --panel-raised: #20242f;
  --border: #2a2f3d;
  --border-soft: #232733;
  --text: #e9ebf1;
  --text-dim: #8b93a7;
  --text-faint: #5a6273;

  --accent: #4fd8c4;
  --accent-dim: #2a5a53;
  --warn: #f2a93a;
  --danger: #f2434b;

  --stat-hp: #f2434b;
  --stat-atk: #f2913a;
  --stat-def: #e8c839;
  --stat-spa: #4f9fe0;
  --stat-spd: #5fd08a;
  --stat-spe: #ed6ec0;

  --font-display: 'Segoe UI Semibold', 'Avenir Next', -apple-system, ui-sans-serif, system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'JetBrains Mono', Menlo, Consolas, monospace;

  --radius: 6px;
  --radius-sm: 4px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.4;
}

body {
  padding: 20px;
  min-height: 100vh;
}

::selection { background: var(--accent-dim); color: var(--text); }

a { color: var(--accent); }

button {
  font-family: inherit;
  cursor: pointer;
}
button:focus-visible,
input:focus-visible,
select:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.app {
  max-width: 1180px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* ---------- Header ---------- */
.app-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  padding: 2px 2px 10px;
  border-bottom: 1px solid var(--border-soft);
}
.app-header .title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 0.2px;
}
.app-header .title .mono-tag {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--accent);
  border: 1px solid var(--accent-dim);
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  margin-left: 8px;
  vertical-align: middle;
}
.tab-nav { display: flex; gap: 6px; }
.share-status {
  font-size: 11px;
  color: var(--accent);
  margin-left: 6px;
}
.tab-btn {
  background: var(--panel-raised);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  font-size: 12.5px;
  font-family: var(--font-body);
}
.tab-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--text); font-weight: 600; }
.tab-btn:hover { border-color: var(--accent); }

/* ---------- Flowchart Battle Planner ---------- */
.fc-tree-scroll {
  overflow-x: auto;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}
.fc-tree-node { display: inline-flex; flex-direction: column; align-items: flex-start; }
.fc-tree-children { display: flex; gap: 14px; padding-left: 18px; margin-top: 8px; border-left: 2px solid var(--border); }
.fc-tree-btn {
  background: var(--panel-raised);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  font-size: 12px;
  white-space: nowrap;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.fc-tree-btn:hover { border-color: var(--accent); }
.fc-tree-btn.current { background: var(--accent-dim); border-color: var(--accent); font-weight: 700; }

.fc-board {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
@media (max-width: 760px) { .fc-board { grid-template-columns: 1fr; } }
.fc-side-col {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.fc-mon-card {
  background: var(--panel-raised);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.fc-mon-card.fainted { opacity: 0.5; }
.fc-mon-name { font-size: 12.5px; font-weight: 600; }
.fc-bench { margin-top: 4px; }
.fc-bench-item { font-size: 11.5px; color: var(--text-faint); padding: 2px 0; }
.fc-bench-item.fainted { text-decoration: line-through; }

.fc-panel-holder {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 12px;
}
.fc-move-info { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); display: flex; flex-direction: column; gap: 3px; }
.fc-divider { border-top: 1px solid var(--border-soft); margin: 4px 0; }
.fc-outcome-box { font-size: 11.5px; color: var(--text-faint); }
.fc-pending-list { display: flex; flex-direction: column; gap: 4px; }
.fc-pending-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--panel-raised);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  padding: 5px 8px;
  font-size: 12px;
}
.fc-boost-row { display: flex; flex-wrap: wrap; gap: 10px; }
.fc-boost-row .acc-eva-row { border: none; padding: 0; width: auto; }
.fc-boost-row input { width: 44px; }

.fc-turn-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
}
.fc-turn-col {
  background: var(--panel-raised);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.fc-turn-sub { display: flex; flex-direction: column; gap: 8px; }
.fc-side-turn-col {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.fc-side-turn-col .fc-turn-col { background: var(--panel-raised); }
.fc-field-section { margin-top: 12px; }
.battle-import {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.battle-import-label { font-size: 12.5px; color: var(--text-dim); }
.battle-import-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 760px) { .battle-import-row { grid-template-columns: 1fr; } }
.battle-import-col { display: flex; flex-direction: column; gap: 6px; }
.battle-import-col label { font-size: 11px; color: var(--text-dim); }
.battle-import-col textarea {
  width: 100%;
  background: var(--panel-raised);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  resize: vertical;
}
.battle-import-error { color: var(--danger); font-size: 12.5px; min-height: 16px; }

.battle-board {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 12px;
}
@media (max-width: 760px) { .battle-board { grid-template-columns: 1fr; } }
.battle-board .mod-badges:last-child { grid-column: 1 / -1; }
.battle-mon-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.battle-mon-fainted { color: var(--text-faint); font-style: italic; font-size: 12.5px; }
.battle-hp-bar { position: relative; }
.battle-hp-text { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim); }
.battle-field-strip {
  grid-column: 1 / -1;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.battle-choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
@media (max-width: 760px) { .battle-choices { grid-template-columns: 1fr; } }
.battle-choice-side { display: flex; flex-direction: column; gap: 8px; }
.battle-choice-col {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.battle-choice-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-faint); margin-top: 4px; }
.battle-waiting { color: var(--text-faint); font-style: italic; font-size: 12.5px; }
.battle-move-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.battle-choice-btn {
  background: var(--panel-raised);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 7px 9px;
  font-size: 12.5px;
  text-align: left;
}
.battle-choice-btn:hover { border-color: var(--accent); }
.battle-choice-btn.disabled { opacity: 0.4; cursor: not-allowed; }
.battle-ended { font-weight: 700; color: var(--accent); padding: 10px; }
.battle-target-picker {
  border-top: 1px solid var(--border-soft);
  padding-top: 6px;
  margin-top: 4px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.battle-log-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-faint); margin-bottom: 6px; }
.battle-log {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  max-height: 260px;
  overflow-y: auto;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 12px;
}
.battle-log-line { padding: 2px 0; }
.battle-log-line.turn-marker { color: var(--accent); font-weight: 700; margin-top: 6px; border-top: 1px solid var(--border-soft); padding-top: 6px; }
.battle-log-line.faint-line { color: var(--danger); font-weight: 600; }
.battle-log-line.win-line { color: var(--warn); font-weight: 700; }

/* ---------- Layout ---------- */
.battlefield {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 860px) {
  .battlefield { grid-template-columns: 1fr; }
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.side-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-faint);
}
.side-label.attacker { color: var(--stat-atk); }
.side-label.defender { color: var(--stat-spa); }

.panel-head-left { display: flex; align-items: center; gap: 8px; }
.attacking-badge {
  display: none;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--bg);
  background: var(--accent);
  padding: 2px 7px;
  border-radius: 999px;
}

.panel-head-btns { display: flex; gap: 6px; }
.import-box {
  display: none;
  flex-direction: column;
  gap: 6px;
  background: var(--panel-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px;
}
.import-box.open { display: flex; }
.import-box textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 8px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  resize: vertical;
}
.import-box-error { color: var(--danger); font-size: 11.5px; min-height: 14px; }

.reset-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: var(--radius-sm);
  font-size: 11px;
  padding: 4px 8px;
  transition: border-color .12s, color .12s;
}
.reset-btn:hover { border-color: var(--danger); color: var(--danger); }

/* ---------- Species row ---------- */
.species-row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.species-field { flex: 1; min-width: 0; }

.type-badges { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.type-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: #fff;
  padding: 2px 7px;
  border-radius: 3px;
  text-shadow: 0 1px 1px rgba(0,0,0,.25);
}

.base-stats-mini {
  display: flex;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-faint);
  margin-top: 4px;
  flex-wrap: wrap;
}
.base-stats-mini span b { color: var(--text-dim); }

/* ---------- Combobox ---------- */
.combo { position: relative; }
.combo label, .field label {
  display: block;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 3px;
}
.combo input, select, .text-input {
  width: 100%;
  background: var(--panel-raised);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 9px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-family: var(--font-body);
}
select { appearance: none; }
.combo-list {
  position: absolute;
  z-index: 40;
  top: calc(100% + 3px);
  left: 0;
  right: 0;
  max-height: 220px;
  overflow-y: auto;
  background: var(--panel-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: 0 10px 24px rgba(0,0,0,.4);
  display: none;
}
.combo-list.open { display: block; }
.combo-option {
  padding: 7px 9px;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.combo-option:hover, .combo-option.active { background: var(--accent-dim); }
.combo-option .opt-meta { color: var(--text-faint); font-family: var(--font-mono); font-size: 11px; }
.combo-empty { padding: 8px 9px; color: var(--text-faint); font-size: 12px; }

/* ---------- Field grid (item/ability/nature/status/level) ---------- */
.field-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.field-grid.four { grid-template-columns: 1fr 1fr; }

.weather-toggle-holder { grid-column: 1 / -1; }
.weather-toggle-btn {
  width: 100%;
  background: var(--panel-raised);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: var(--radius-sm);
  padding: 6px 9px;
  font-size: 12px;
  text-align: left;
}
.weather-toggle-btn:hover { border-color: var(--accent); color: var(--text); }
.weather-toggle-btn.active {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--text);
  font-weight: 600;
}
.weather-toggle-btn.blocked {
  opacity: 0.5;
  cursor: not-allowed;
}
.weather-toggle-note {
  font-size: 10.5px;
  color: var(--warn);
  margin-top: 4px;
  line-height: 1.3;
}

/* ---------- Stat table ---------- */
.acc-eva-block {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 6px 0;
  border-top: 1px solid var(--border-soft);
  border-bottom: 1px solid var(--border-soft);
}
.acc-eva-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.acc-eva-label { font-size: 11.5px; color: var(--text-dim); }

.result-acc {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
}
.result-acc.modified { color: var(--warn); }
.result-acc.dim { color: var(--text-faint); font-style: italic; }

.stat-table {
  display: grid;
  grid-template-columns: 46px 1fr 52px 52px 60px 34px;
  gap: 5px 6px;
  align-items: center;
  font-family: var(--font-mono);
}
.stat-table .stat-hdr {
  font-size: 10px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.stat-name {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 5px;
  border-radius: 3px;
  text-align: center;
}
.stat-bar-wrap {
  height: 6px;
  background: var(--border-soft);
  border-radius: 3px;
  overflow: hidden;
}
.stat-bar-fill { height: 100%; border-radius: 3px; }
.stat-table input {
  width: 100%;
  background: var(--panel-raised);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 3px;
  padding: 4px 3px;
  font-size: 12px;
  font-family: var(--font-mono);
  text-align: center;
}
.stat-final {
  font-size: 12px;
  text-align: right;
  color: var(--text-dim);
  padding-right: 2px;
}
.stat-final.buffed { color: var(--stat-spd); }
.stat-final.hindered { color: var(--stat-hp); }

.boost-stepper {
  display: flex;
  align-items: center;
  gap: 2px;
  justify-content: center;
}
.boost-stepper button {
  width: 18px; height: 18px;
  background: var(--panel-raised);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 3px;
  font-size: 11px;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.boost-stepper button:hover { border-color: var(--accent); color: var(--accent); }
.boost-val {
  width: 20px;
  text-align: center;
  font-size: 11px;
  color: var(--text-faint);
}
.boost-val.nonzero {
  color: var(--bg);
  background: var(--warn);
  border-radius: 3px;
  font-weight: 700;
}

.ev-total {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
  text-align: right;
}
.ev-total.over { color: var(--danger); font-weight: 700; }

/* modifier badges (visible non-default state indicator) */
.mod-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  min-height: 20px;
}
.mod-badge {
  font-family: var(--font-mono);
  font-size: 10.5px;
  padding: 2px 7px;
  border-radius: 999px;
  background: rgba(242, 169, 58, 0.14);
  border: 1px solid var(--warn);
  color: var(--warn);
}

/* ---------- Moves (4-slot, click to calculate) ---------- */
.moves-section { display: flex; flex-direction: column; gap: 6px; }
.moves-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
@media (max-width: 480px) {
  .moves-grid { grid-template-columns: 1fr; }
}
.move-slot {
  position: relative;
  display: flex;
  align-items: stretch;
  gap: 4px;
}
.move-slot-btn {
  flex: 1;
  text-align: left;
  background: var(--panel-raised);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 9px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  transition: border-color .12s, background .12s;
}
.move-slot.active .move-slot-btn {
  background: var(--accent-dim);
  border-color: var(--accent);
}
.move-slot-btn:hover { border-color: var(--accent); }
.move-slot-name {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text);
}
.move-slot-name.empty { color: var(--text-faint); font-weight: 400; font-style: italic; }
.move-slot-meta {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-faint);
}
.move-slot-edit {
  width: 26px;
  background: var(--panel-raised);
  border: 1px solid var(--border);
  color: var(--text-faint);
  border-radius: var(--radius-sm);
  font-size: 12px;
}
.move-slot-edit:hover { color: var(--accent); border-color: var(--accent); }
.move-slot-combo-holder {
  display: none;
  position: absolute;
  z-index: 50;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
}
.move-slot-combo-holder.open { display: block; }
.hits-override {
  position: absolute;
  top: calc(100% + 2px);
  left: 0;
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-faint);
  background: var(--panel);
  padding: 2px 4px;
  z-index: 5;
}
.hits-override input {
  width: 40px;
  background: var(--panel-raised);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 3px;
  padding: 2px 4px;
  font-size: 11px;
  font-family: var(--font-mono);
  text-align: center;
}
.move-slot:has(.hits-override) { margin-bottom: 16px; }

/* ---------- Summary (read-only aggregate of active modifiers, below result) ---------- */
.summary-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}
.summary-panel-label {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-faint);
  margin-bottom: 10px;
}
.summary-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
}
@media (max-width: 700px) {
  .summary-wrap { grid-template-columns: 1fr; }
}
.summary-col { display: flex; flex-direction: column; gap: 6px; }
.summary-none {
  font-size: 11.5px;
  color: var(--text-faint);
  font-style: italic;
}

/* ---------- Move / result strip ---------- */
.move-strip {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  gap: 14px;
  align-items: flex-end;
  flex-wrap: wrap;
}
.move-strip .combo { flex: 1; min-width: 220px; }
.move-meta {
  display: flex;
  gap: 10px;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
}
.move-meta-who { color: var(--text); font-weight: 600; margin-right: 4px; }
.crit-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap;
  cursor: pointer;
}
.swap-btn {
  background: var(--panel-raised);
  border: 1px solid var(--border);
  color: var(--accent);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 13px;
  font-family: var(--font-mono);
  white-space: nowrap;
}
.swap-btn:hover { border-color: var(--accent); }

/* ---------- Field conditions ---------- */
.conditions {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;
}
.conditions .field { min-width: 130px; }
.conditions .checks {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--text-dim);
}
.conditions .checks label {
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.conditions-label {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-faint);
  width: 100%;
}
.conditions .mod-badges { flex-basis: 100%; min-height: 0; }

/* ---------- Result ---------- */
.result {
  background: var(--panel);
  border: 1px solid var(--accent-dim);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.result-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px;
}
.result-pct {
  font-family: var(--font-mono);
  font-size: 26px;
  font-weight: 700;
}
.result-ko {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 0.2px;
}
.result-ko.lethal { color: var(--danger); }

.hp-bar-wrap {
  height: 18px;
  border-radius: 4px;
  background: var(--bg);
  border: 1px solid var(--border);
  overflow: hidden;
  position: relative;
}
.dmg-guaranteed { position: absolute; top: 0; bottom: 0; left: 0; background: #3ea85a; }
.dmg-range { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, #f2434b, #f2434b 4px, #c93540 4px, #c93540 8px); }

.result-desc {
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--text-dim);
  background: var(--panel-raised);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  white-space: pre-wrap;
  word-break: break-word;
}
.result-error {
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--danger);
}

.footer-note {
  font-size: 11px;
  color: var(--text-faint);
  text-align: center;
  padding: 6px 0 0;
}
.footer-note a { color: var(--text-faint); }

</style>
</head>

    var table = ACCURACY_TABLE['gen' + GEN_NUM];
    if (!table) return null;
    var id = C.toID(moveName);
    return table.hasOwnProperty(id) ? table[id] : null;
  }

  var OHKO_MOVES = { fissure: 1, guillotine: 1, horndrill: 1, sheercold: 1 };
  var WEATHER_ACC_OVERRIDE_MOVES = {
    thunder: { rainAlways: true, sunAcc: 50 },
    hurricane: { rainAlways: true, sunAcc: 50 },
    blizzard: { snowAlways: true }
  };

  function accStageToRatio(stage) {
    stage = clamp(stage, -6, 6);
    return stage >= 0 ? (3 + stage) / 3 : 3 / (3 - stage);
  }

  // Computes effective accuracy%, factoring in Gravity, accuracy/evasion stat stages,
  // No Guard, Compound Eyes / Hustle / Sand Veil / Snow Cloak, Wide Lens / Bright Powder / Lax Incense,
  // and weather-specific move overrides (Thunder/Hurricane in Rain/Sun, Blizzard in Snow).
  // Not exhaustive (e.g. Zoom Lens, Victory Star, confusion-based evasion aren't modelled) but covers
  // the modifiers that come up in practice.
  function computeAccuracyInfo(moveName, atkState, defState) {
    var id = C.toID(moveName);
    var base = getBaseAccuracy(moveName);
    if (base === true || base === null) return { base: base, effective: null, notes: [], cantMiss: base === true, unknown: base === null };

    var acc = base;
    var notes = [];
    var weather = state.field.weather;

    var wOverride = WEATHER_ACC_OVERRIDE_MOVES[id];
    if (wOverride) {
      if ((weather === 'Rain' || weather === 'Heavy Rain') && wOverride.rainAlways) { acc = 100; notes.push('always hits in Rain'); }
      else if ((weather === 'Sun' || weather === 'Harsh Sunshine') && wOverride.sunAcc) { acc = wOverride.sunAcc; notes.push('reduced in Sun'); }
      else if (weather === 'Snow' && wOverride.snowAlways) { acc = 100; notes.push('always hits in Snow'); }
    }

    var atkAbility = C.toID(atkState.ability);
    var defAbility = C.toID(defState.ability);
    if (atkAbility === 'noguard' || defAbility === 'noguard') {
      return { base: base, effective: 100, notes: ['No Guard: always hits'], cantMiss: true };
    }

    var stageDiff = clamp((atkState.boosts.accuracy || 0) - (defState.boosts.evasion || 0), -6, 6);
    if (stageDiff !== 0) { acc *= accStageToRatio(stageDiff); notes.push('accuracy/evasion stages'); }

    if (state.field.gravity && !OHKO_MOVES[id]) {
      var gravMult = GEN_NUM <= 4 ? (5 / 3) : (6840 / 4096);
      acc *= gravMult;
      notes.push('Gravity');
    }

    if (atkAbility === 'compoundeyes') { acc *= 1.3; notes.push('Compound Eyes'); }
    var mv = gen.moves.get(id);
    if (atkAbility === 'hustle' && mv && mv.category === 'Physical') { acc *= 0.8; notes.push('Hustle'); }
    if (defAbility === 'sandveil' && weather === 'Sand') { acc *= 0.8; notes.push('Sand Veil'); }
    if (defAbility === 'snowcloak' && weather === 'Snow') { acc *= 0.8; notes.push('Snow Cloak'); }

    var atkItem = C.toID(atkState.item);
    var defItem = C.toID(defState.item);
    if (atkItem === 'widelens') { acc *= 1.1; notes.push('Wide Lens'); }
    if (defItem === 'brightpowder') { acc *= 0.9; notes.push('Bright Powder'); }
    if (defItem === 'laxincense') { acc *= 0.9; notes.push('Lax Incense'); }

    acc = Math.min(100, Math.max(0, Math.round(acc)));
    return { base: base, effective: acc, notes: notes, cantMiss: false };
  }

  function defaultMon(species) {
    return {
      species: species,
      level: 100,
      item: '',
      ability: (gen.species.get(C.toID(species)) || {}).abilities ? gen.species.get(C.toID(species)).abilities['0'] || '' : '',
      nature: 'Serious',
      status: '',
      teraType: '',
      isDynamaxed: false,
      powerTrick: false,
      curHPPercent: 100,
      ivs: { hp: 31, atk: 31, def: 31, spa: 31, spd: 31, spe: 31 },
      evs: { hp: 0, atk: 0, def: 0, spa: 0, spd: 0, spe: 0 },
      boosts: { atk: 0, def: 0, spa: 0, spd: 0, spe: 0, accuracy: 0, evasion: 0 },
      moves: [defaultMoveState(), defaultMoveState(), defaultMoveState(), defaultMoveState()]
    };
  }

  function defaultMoveState() { return { name: '', hits: null }; }

  var EV_IV_ABBR = { hp: 'hp', atk: 'atk', def: 'def', spa: 'spa', spd: 'spd', spe: 'spe' };

  function parseShowdownSet(text) {
    var lines = text.split('\n').map(function (l) { return l.trim(); }).filter(function (l) { return l.length; });
    if (!lines.length) return null;
    var result = {
      species: null, item: '', ability: '', level: 100, nature: 'Serious',
      evs: { hp: 0, atk: 0, def: 0, spa: 0, spd: 0, spe: 0 },
      ivs: { hp: 31, atk: 31, def: 31, spa: 31, spd: 31, spe: 31 },
      teraType: '', moves: []
    };
    var first = lines[0].replace(/\s*\((M|F)\)\s*$/, '');
    var atIdx = first.indexOf(' @ ');
    var namePart = atIdx === -1 ? first : first.slice(0, atIdx);
    if (atIdx !== -1) result.item = first.slice(atIdx + 3).trim();
    var parenMatch = namePart.match(/\(([^)]+)\)/);
    result.species = (parenMatch ? parenMatch[1] : namePart).trim();

    for (var i = 1; i < lines.length; i++) {
      var line = lines[i];
      var m;
      if (/^ability:/i.test(line)) result.ability = line.split(':').slice(1).join(':').trim();
      else if (/^level:/i.test(line)) result.level = parseInt(line.split(':')[1], 10) || 100;
      else if (/^tera type:/i.test(line)) result.teraType = line.split(':').slice(1).join(':').trim();
      else if (/^evs:/i.test(line)) {
        line.slice(4).split('/').forEach(function (part) {
          var mm = part.trim().match(/^(\d+)\s+(\w+)/);
          if (mm && EV_IV_ABBR[mm[2].toLowerCase()]) result.evs[EV_IV_ABBR[mm[2].toLowerCase()]] = parseInt(mm[1], 10);
        });
      } else if (/^ivs:/i.test(line)) {
        line.slice(4).split('/').forEach(function (part) {
          var mm = part.trim().match(/^(\d+)\s+(\w+)/);
          if (mm && EV_IV_ABBR[mm[2].toLowerCase()]) result.ivs[EV_IV_ABBR[mm[2].toLowerCase()]] = parseInt(mm[1], 10);
        });
      } else if (/nature\s*$/i.test(line)) {
        result.nature = line.replace(/nature\s*$/i, '').trim();
      } else if (/^-\s*/.test(line)) {
        var moveName = line.replace(/^-\s*/, '').split('[')[0].trim();
        if (moveName && result.moves.length < 4) result.moves.push(moveName);
      }
    }
    return result.species ? result : null;
  }

  function applyImportedSet(key, text) {
    var parsed = parseShowdownSet(text);
    if (!parsed) return 'Could not parse that paste \u2014 check the format.';
    if (!speciesExists(parsed.species)) return '\u201c' + parsed.species + '\u201d isn\u2019t a valid species in Gen ' + GEN_NUM + '.';

    var mon = defaultMon(parsed.species);
    mon.level = clamp(parsed.level, 1, 100);
    mon.item = parsed.item && itemExists(parsed.item) ? parsed.item : '';
    if (parsed.ability && abilityExists(parsed.ability)) mon.ability = parsed.ability;
    mon.evs = parsed.evs;
    mon.ivs = parsed.ivs;

    var natureMatch = null;
    for (var nn of gen.natures) { if (nn.name.toLowerCase() === (parsed.nature || '').toLowerCase()) { natureMatch = nn.name; break; } }
    mon.nature = natureMatch || 'Serious';

    if (GEN_NUM >= 9 && parsed.teraType) mon.teraType = parsed.teraType;

    mon.moves = parsed.moves.map(function (name) {
      return { name: moveExists(name) ? name : '', hits: null };
    });
    while (mon.moves.length < 4) mon.moves.push(defaultMoveState());

    state[key] = mon;
    return null;
  }

  // ---------- helpers ----------
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (k === 'class') node.className = attrs[k];
      else if (k === 'text') node.textContent = attrs[k];
      else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function speciesObj(name) { return gen.species.get(C.toID(name)); }

  // ---------- generic combobox ----------
  function combobox(opts) {
    // opts: {label, getOptions(query)->[{id,label,meta}], value, onSelect(id,label), placeholder}
    var wrap = el('div', { class: 'combo' });
    if (opts.label) wrap.appendChild(el('label', { text: opts.label }));
    var input = el('input', { type: 'text', placeholder: opts.placeholder || '', autocomplete: 'off', value: opts.value || '' });
    var list = el('div', { class: 'combo-list' });
    wrap.appendChild(input);
    wrap.appendChild(list);

    function renderList(query) {
      list.innerHTML = '';
      var options = opts.getOptions(query || '');
      if (!options.length) {
        list.appendChild(el('div', { class: 'combo-empty', text: 'No matches' }));
      } else {
        options.slice(0, 60).forEach(function (o) {
          var row = el('div', { class: 'combo-option' }, [
            el('span', { text: o.label }),
            o.meta ? el('span', { class: 'opt-meta', text: o.meta }) : null
          ]);
          row.addEventListener('mousedown', function (e) {
            e.preventDefault();
            input.value = o.label;
            list.classList.remove('open');
            opts.onSelect(o.id, o.label);
          });
          list.appendChild(row);
        });
      }
      list.classList.add('open');
    }
    input.addEventListener('focus', function () { renderList(input.value); });
    input.addEventListener('input', function () { renderList(input.value); });
    input.addEventListener('blur', function () { setTimeout(function () { list.classList.remove('open'); }, 120); });
    wrap.setValue = function (v) { input.value = v; };
    return wrap;
  }
